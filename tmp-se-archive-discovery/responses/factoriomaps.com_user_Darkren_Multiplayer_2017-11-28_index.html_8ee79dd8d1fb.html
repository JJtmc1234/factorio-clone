<!DOCTYPE html><html><head>
    <title>Multiplayer - FactorioMaps</title>
    <meta name="og:image" content="https://i.factoriomaps.com/1b8lo.png">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.3.3/leaflet.css" integrity="sha256-iYUgmrapfDGvBrePJPrMWQZDcObdAcStKBpjP3Az+3s=" crossorigin="anonymous">

    <style type="text/css">
        html {
            height: 100%
        }

        body {
            height: 100%;
            margin: 0px;
            padding: 0px
        }

        #map {
            height: 100%;
            z-index: 0;
            background-color: rgb(27, 44, 51) !important;
        }

        #gmnoprint {
            width: auto;
        }

        /* DOWN BUTTON CSS */
        #downBtn {
            position: fixed;
            /* Fixed/sticky position */
            bottom: 0px;
            /* Place the button at the bottom of the page */
            right: 50%;
            transform: translate(50%, 0);
            z-index: 99;
            /* Make sure it does not overlap */
            border: none;
            /* Remove borders */
            outline: none;
            /* Remove outline */
            background-color: chocolate;
            /* Set a background color */
            color: white;
            /* Text color */
            cursor: pointer;
            /* Add a mouse pointer on hover */
            padding: 5px;
            /* Some padding */
            border-radius: 7px;
            /* Rounded corners */
            font-size: 18px;
            /* Increase font size */
        }

        #downBtn:hover {
            background-color: #555;
            /* Add a dark-grey background on hover */
        }

        /* FANCY DOWNLOAD CSS */
        #modal {
            display: none;
            position: absolute;
            top: 150px;
            bottom: 30px;
            background-color: rgb(27, 45, 51);
            padding: 20px;
            z-index: 100;
            width: 400px;
            right: 50%;
            margin-right: -200px;
            border: none;
            border-radius: 5px;
            color: #C6FFFD;
        }

        #modal.open {
            display: block;
        }

        #modal ul li {
            list-style-type: none;
            margin-bottom: 5px;
        }

        #modal .close {
            cursor: pointer;
            float: right;
            margin-top: -20px;
        }

        #modal .title {
            font-size: 2em;
            text-align: center;
            margin-bottom: 15px;
        }

        #modal .mapLayerLink {
            float: right;
            padding: 0px 25px;
            background-color: chocolate;
            color: #CFFFFD;
            border-radius: 8px;
            line-height: 35px;
        }

        #modal .mapLayerLink.disabled {
            background-color: grey;
            cursor: not-allowed;
        }

        #modal .mapLayerLink:hover {
            background-color: #555;
        }

        hr.clear {
            clear: both;
            float: none;
            border: 0;
            width: 0;
            height: 0;
            padding: 0;
            margin: 0;
        }

        #modal .body {
            overflow-y: auto;
            max-height: 92%;
        }

        /* END FANCY DOWNLOAD CSS */
        
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.3.3/leaflet.js" integrity="sha256-lwWHyfIX653fxmxYjZUYOSM7ufWv6dMT8ISVuTWwoOY=" crossorigin="anonymous"></script>
    <script src="https://factoriomaps.com/assets/js/leaflet/plugins/leaflet-fullHash/0.1.0/leaflet-fullHash.min.js"></script>
    <link href="https://factoriomaps.com/assets/js/leaflet/plugins/leaflet-fullscreen/1.0.1/leaflet.fullscreen.css" rel="stylesheet">
    <script src="https://factoriomaps.com/assets/js/leaflet/plugins/leaflet-fullscreen/1.0.1/Leaflet.fullscreen.min.js"></script>
</head>

<body>
    <!-- FANCY DOWNLOAD -->
    <div id="buttonAnchor"></div>
    <div id="modal">
        <div class="title">
            Download the world saves <span class="close" title="Close">x</span>
        </div>
        <div class="body">
            This maps has multiple layers available, which means there can be multiple saves available. Please select the one you wish
            to download :
            <ul id="save-download-container"></ul>
        </div>
    </div>
    <!-- END FANCY DOWNLOAD -->
    
    <div id="map" style="background: rgb(27, 45, 51); position: relative;" class="leaflet-container leaflet-touch leaflet-fade-anim leaflet-grab leaflet-touch-drag leaflet-touch-zoom" tabindex="0"><div class="leaflet-pane leaflet-map-pane" style="transform: translate3d(0px, 0px, 0px);"><div class="leaflet-pane leaflet-tile-pane"><div class="leaflet-layer " style="z-index: 1; opacity: 1;"><div class="leaflet-tile-container leaflet-zoom-animated" style="z-index: 8; transform: translate3d(0px, 0px, 0px) scale(1);"><img alt="" role="presentation" src="https://map-images.factoriomaps.com/user/Darkren/Multiplayer/2017-11-28/Images/Day/3/0/0.jpg?z=3&amp;b2=3-8&amp;gcs=3-8" class="leaflet-tile leaflet-tile-loaded" style="width: 1024px; height: 1024px; transform: translate3d(-224px, -524px, 0px); opacity: 1;"><img alt="" role="presentation" src="https://map-images.factoriomaps.com/user/Darkren/Multiplayer/2017-11-28/Images/Day/3/1/0.jpg?z=3&amp;b2=3-8&amp;gcs=3-8" class="leaflet-tile leaflet-tile-loaded" style="width: 1024px; height: 1024px; transform: translate3d(800px, -524px, 0px); opacity: 1;"><img alt="" role="presentation" src="https://map-images.factoriomaps.com/user/Darkren/Multiplayer/2017-11-28/Images/Day/3/0/1.jpg?z=3&amp;b2=3-8&amp;gcs=3-8" class="leaflet-tile leaflet-tile-loaded" style="width: 1024px; height: 1024px; transform: translate3d(-224px, 500px, 0px); opacity: 1;"><img alt="" role="presentation" src="https://map-images.factoriomaps.com/user/Darkren/Multiplayer/2017-11-28/Images/Day/3/1/1.jpg?z=3&amp;b2=3-8&amp;gcs=3-8" class="leaflet-tile leaflet-tile-loaded" style="width: 1024px; height: 1024px; transform: translate3d(800px, 500px, 0px); opacity: 1;"></div></div></div><div class="leaflet-pane leaflet-shadow-pane"></div><div class="leaflet-pane leaflet-overlay-pane"></div><div class="leaflet-pane leaflet-marker-pane"></div><div class="leaflet-pane leaflet-tooltip-pane"></div><div class="leaflet-pane leaflet-popup-pane"></div><div class="leaflet-proxy leaflet-zoom-animated" style="transform: translate3d(1024px, 1024px, 0px) scale(4);"></div></div><div class="leaflet-control-container"><div class="leaflet-top leaflet-left"></div><div class="leaflet-top leaflet-right"></div><div class="leaflet-bottom leaflet-left"><div class="leaflet-control-zoom leaflet-bar leaflet-control"><a class="leaflet-control-zoom-in" href="#" title="Zoom in" role="button" aria-label="Zoom in">+</a><a class="leaflet-control-zoom-out" href="#" title="Zoom out" role="button" aria-label="Zoom out">−</a></div></div><div class="leaflet-bottom leaflet-right"><div class="leaflet-control-fullscreen leaflet-bar leaflet-control"><a class="leaflet-control-fullscreen-button leaflet-bar-part" href="#" title="View Fullscreen"></a></div><div class="leaflet-control-attribution leaflet-control"><a href="http://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> | <a href="https://mods.factorio.com/mods/credomane/FactorioMaps">FactorioMaps</a></div></div></div></div>
    <script>
        var m = JSON.parse('{"version":5,"links":{"url":"https://factoriomaps.com/user/Darkren/Multiplayer/2017-11-28/index.html","preview":"https://i.factoriomaps.com/1b8lo.png","save":""},"meta":{"source":{"user":{"username":"Darkren"},"submission":{"date":"2018-08-11T20:04:49.0000000","id":""}},"map":{"version":1,"contributors":[{"username":"Darkren"}],"details":{"playTime":{"ticks":0,"hours":0,"minutes":0,"seconds":0},"mods":null,"gen":{"spawn":{"x":0,"y":0},"seed":0,"exchangeString":"","factorioVersion":"0.16.51"}},"options":{"timeline":false,"imageCompression":false,"modded":false,"layers":1,"collapseLayerList":false,"beta":false,"anonymous":false,"publicServer":false,"deprecatedTopUser":false,"normalUser":true},"markers":null,"layers":[{"name":"Day","zoom":{"extraZoomOut":2,"min":3,"max":8},"tiles":{"size":1024,"url":"Images/{id}/{z}/{x}/{y}.jpg","backend":{"remotes":[{"name":"b2","enabled":true,"zoom":{"min":3,"max":8}},{"name":"gcs","enabled":true,"zoom":{"min":3,"max":8}}],"useMapImagesUrl":true,"fullUrl":"https://map-images.factoriomaps.com/user/Darkren/Multiplayer/2017-11-28/Images/{id}/{z}/{x}/{y}.jpg?z={z}\u0026b2=3-8\u0026gcs=3-8"},"chunks":""},"playTime":{"ticks":0,"hours":0,"minutes":0,"seconds":0},"save":{"download":"","name":""},"playerPosition":{"x":0,"y":0,"known":false}}],"saveDate":"2017-11-28","title":"Multiplayer","path":"user/Darkren/Multiplayer/2017-11-28"},"tags":null},"generation":{"index":"index.html","leaflet":{"crsSimple":false,"startCoords":{"x":0,"y":0}},"css":[],"buttons":[]}}')

        var layers = {}, saves = [], countAvailableSaves = 0;
        for (i = 0; i < m.meta.map.layers.length; i++) {
            layer = m.meta.map.layers[i];
            var minZoom = layer.zoom.min - layer.zoom.extraZoomOut;
            if (minZoom < 1) {
                minZoom = 1;
            }
            var tileUrl = layer.tiles.url;
            if (location.host !== "") {
                tileUrl = "https://factoriomaps.com/" + m.meta.map.path + "/" + tileUrl;
            }
            if(location.host !== "" && layer.tiles.backend && layer.tiles.backend.fullUrl && layer.tiles.backend.useMapImagesUrl){
                tileUrl = layer.tiles.backend.fullUrl
            }
            layers[layer.name] = L.tileLayer(tileUrl, {
                id: layer.name,
                attribution: '<a href="https://mods.factorio.com/mods/credomane/FactorioMaps">FactorioMaps</a>',
                minNativeZoom: layer.zoom.min,
                maxNativeZoom: layer.zoom.max,
                minZoom: minZoom,
                maxZoom: layer.zoom.max,
                noWrap: true,
                tileSize: layer.tiles.size, // This breaks leaflet-fullHash:  / window.devicePixelRatio,
                keepBuffer: 3
            });
            /* EDIT */
            if (layer.save.download !== null && layer.save.download !== "") {
                saves.push({
                    layer: layer.save.name || layer.name,
                    url: layer.save.url
                });
                if (layer.save.url) {
                    countAvailableSaves++;
                }
            }

            /* END EDIT */
        }
        /* EDIT */
        if (countAvailableSaves > 0 || m.links.save) {
            var btn = document.createElement("a"), modal = document.getElementById("modal"), ulContainer = document.getElementById("save-download-container"), modalClose = modal.getElementsByClassName("close")[0], opened = false, built = false;
            btn.id = 'downBtn';
            btn.appendChild(document.createTextNode("Download Save"))
            if (saves.length <= 1) {
                //Act like a download link
                btn.href = saves.length === 1 ? saves[0].url : m.links.save;
                btn.target = '_blank';
            } else {
                btn.addEventListener('click', function () {
                    if (!opened) {
                        if (!built) {
                            //Empty the modal, re-create modal content and display it
                            while (ulContainer.lastChild) {
                                ulContainer.removeChild(ulContainer.lastChild);
                            }
                            for (var i in saves) {
                                if (saves.hasOwnProperty(i)) {
                                    var saveObj = saves[i];
                                    var li = document.createElement("li"), a = document.createElement("a"), span = document.createElement("span"), hr = document.createElement("hr");
                                    hr.classList.add("clear");
                                    a.classList.add("mapLayerLink");
                                    li.classList.add("mapLayer");
                                    a.appendChild(document.createTextNode("Download"));

                                    a.target = "_blank";
                                    if (!saveObj.url) {
                                        a.setAttribute("disabled", "disabled");
                                        a.classList.add("disabled");
                                    } else {
                                        a.href = saveObj.url;
                                    }
                                    span.classList.add("mapLayerName")
                                    span.appendChild(document.createTextNode(saveObj.layer));
                                    li.appendChild(span);
                                    li.appendChild(a);
                                    li.appendChild(hr);
                                    ulContainer.appendChild(li);
                                }
                            }
                            modal.classList.add("open");
                            opened = true;
                        }
                    }
                });
                modalClose.addEventListener("click", function () {
                    if (opened) {
                        modal.classList.remove("open");
                        opened = false;
                    }
                });
            }
            document.getElementById("buttonAnchor").appendChild(btn);
        }

        /* END EDIT */
        var startZoom = m.meta.map.layers[0].zoom.min;
        var startCoords = [m.generation.leaflet.startCoords.x, m.generation.leaflet.startCoords.y];
        var map;
        if(m.generation.leaflet.crsSimple){
            map = L.map('map', {
                layers: [layers[m.meta.map.layers[0].name]],
                fadeAnimation: true,
                zoomAnimation: true,
                updateWhenZooming: true,
                crs: L.CRS.Simple
            }).setView(startCoords, startZoom);
        }else{
            map = L.map('map', {
                layers: [layers[m.meta.map.layers[0].name]],
                fadeAnimation: true,
                zoomAnimation: true,
                updateWhenZooming: true
            }).setView(startCoords, startZoom);
        }
        if (m.meta.map.layers.length > 1) {
            L.control.layers(layers, {}, { collapsed: m.meta.map.options.collapseLayerList }).addTo(map).setPosition('bottomright');
        }
        map.addControl(new L.Control.Fullscreen().setPosition('bottomright'));
        map.zoomControl.setPosition('bottomleft')
        if (m.meta.map.markers !== null && m.meta.map.markers !== undefined) {
            for (i = 0; i < m.meta.map.markers.length; i++) {
                var markerData = m.meta.map.markers[i], div = document.createElement('div'), title = document.createElement('h3');
                div.innerHTML = '<h3>' + markerData.title + '</h3>' + markerData.text;
                L.marker(markerData.coords, { title: markerData.title }).addTo(map).bindPopup(div);
            }
        }
        new L.Hash(map, layers);
    </script>



</body></html>
