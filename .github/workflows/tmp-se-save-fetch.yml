name: Temporary SE video save-link search

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  RESULT_BRANCH: "tmp-se-save-result-20260824"

jobs:
  search:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install yt-dlp
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade yt-dlp

      - name: Search YouTube and extract every external save link
        shell: bash
        run: |
          set -euo pipefail
          rm -rf published work
          mkdir -p published work

          cat > work/search.py <<'PY'
          import json, re, subprocess, pathlib, time

          queries = [
              "Factorio Space Exploration 0.7 first cargo rocket",
              "Factorio Space Exploration 0.7 rocket science",
              "Factorio SE 0.7 cargo rocket",
              "Factorio Space Exploration 0.7 save game",
              "Factorio SE 0.7 pre space",
              "Factorio Space Exploration 0.7 playthrough",
          ]
          exact_ids = ["dDyBD4oE5Qg"]
          candidates = {}

          def run(args, timeout=180):
              return subprocess.run(args, text=True, capture_output=True, timeout=timeout)

          for q in queries:
              result = run(["yt-dlp", "--flat-playlist", "--dump-json", f"ytsearch40:{q}"], timeout=240)
              pathlib.Path("published/search-stderr.txt").open("a").write(result.stderr)
              for line in result.stdout.splitlines():
                  try:
                      obj = json.loads(line)
                  except Exception:
                      continue
                  vid = obj.get("id")
                  if not vid:
                      continue
                  title = obj.get("title") or ""
                  candidates.setdefault(vid, {"id": vid, "title": title, "queries": []})["queries"].append(q)

          for vid in exact_ids:
              candidates.setdefault(vid, {"id": vid, "title": "", "queries": ["exact known lead"]})

          # Prioritize titles that are plausibly around the target checkpoint.
          target_words = (
              "rocket", "space", "orbit", "science", "cargo", "launch", "preparation",
              "first space", "nauvis", "automation", "automating"
          )
          ordered = sorted(
              candidates.values(),
              key=lambda x: (0 if any(w in x["title"].lower() for w in target_words) else 1, x["title"].lower())
          )[:120]

          url_re = re.compile(r"https?://[^\s<>\]\[()\"']+")
          file_host_re = re.compile(
              r"(?:drive\.google\.com|docs\.google\.com|dropbox\.com|onedrive\.live\.com|1drv\.ms|mega\.nz|"
              r"mediafire\.com|github\.com|gitlab\.com|patreon\.com|ko-fi\.com|factorio\.com|refactorio\.de|"
              r"\.zip(?:[?&#]|$))",
              re.I,
          )
          results = []

          for index, item in enumerate(ordered):
              vid = item["id"]
              url = f"https://www.youtube.com/watch?v={vid}"
              proc = run([
                  "yt-dlp", "--skip-download", "--no-warnings", "--dump-single-json", url
              ], timeout=180)
              rec = dict(item)
              rec["url"] = url
              rec["metadata_error"] = proc.stderr[-2000:] if proc.returncode else ""
              if proc.returncode == 0:
                  try:
                      meta = json.loads(proc.stdout)
                  except Exception as exc:
                      rec["metadata_error"] = repr(exc)
                  else:
                      desc = meta.get("description") or ""
                      rec.update({
                          "title": meta.get("title") or rec["title"],
                          "channel": meta.get("channel") or meta.get("uploader"),
                          "upload_date": meta.get("upload_date"),
                          "duration": meta.get("duration"),
                          "description": desc,
                          "external_urls": url_re.findall(desc),
                      })
                      rec["potential_save_links"] = [u.rstrip(".,;:!?") for u in rec["external_urls"] if file_host_re.search(u)]
              results.append(rec)
              if index % 20 == 19:
                  time.sleep(2)

          pathlib.Path("published/youtube-results.json").write_text(json.dumps(results, indent=2))
          links = []
          for r in results:
              for link in r.get("potential_save_links", []):
                  links.append({
                      "video_id": r["id"],
                      "title": r.get("title"),
                      "channel": r.get("channel"),
                      "upload_date": r.get("upload_date"),
                      "video_url": r.get("url"),
                      "link": link,
                  })
          pathlib.Path("published/potential-save-links.json").write_text(json.dumps(links, indent=2))
          pathlib.Path("published/potential-save-links.txt").write_text("\n".join(
              f"{x['upload_date']} | {x['channel']} | {x['title']}\n{x['video_url']}\n{x['link']}\n"
              for x in links
          ))

          # Preserve the exact Bold Viking result separately for easy inspection.
          bold = [r for r in results if r["id"] == "dDyBD4oE5Qg"]
          pathlib.Path("published/bold-viking.json").write_text(json.dumps(bold, indent=2))
          print(f"videos={len(results)} potential_links={len(links)}")
          PY
          python3 work/search.py | tee published/summary.txt

      - name: Publish findings to disposable result branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$RESULT_BRANCH"
          rm -rf tmp-se-youtube-search
          mkdir -p tmp-se-youtube-search
          cp -a published/. tmp-se-youtube-search/
          git add -f tmp-se-youtube-search
          git commit -m 'Search video descriptions for public SE saves'
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
