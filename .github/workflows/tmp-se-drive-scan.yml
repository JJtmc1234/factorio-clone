name: Temporary public SE Drive candidate inspection

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  RESULT_BRANCH: "tmp-se-drive-result-20260824"

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and recursively inspect public candidate bundles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work published
          mkdir -p work/downloads work/actual-saves published/previews published/reports published/chunks published/listings
          python3 -m pip install --quiet --upgrade gdown

          cat > work/candidates.json <<'JSON'
          [
            {"id":"1zA_uoOIYn3dpO92empFJY0WPg7XSY29k","name":"rampant_starter_planet_only","source":"veden/Rampant issue 66","note":"SE+K2; author says only starter planet and some satellites, no other planets visited"},
            {"id":"1hyn5Do8q8xDSUK4Aqe6B8uRGE6gGfcJG","name":"blueprint_sandbox_cargo_rocket","source":"EarendelDevelopers/factorio-mods issue 275","note":"SE 0.6.98; cargo rocket launch bug"},
            {"id":"1Tin_CrL075mHPVhDVdZtFErzZb86Hxbo","name":"miniloader_migration_06146","source":"hgschmie/factorio-miniloader-redux issue 31","note":"Known SE 0.6.146 migration bundle"},
            {"id":"1nScbABVE1hugI9Oj5Li6XRotivrJuBsp","name":"migration_workaround_0754","source":"EarendelDevelopers/factorio-mods issue 392","note":"Migrated 0.6 to 0.7 bundle"},
            {"id":"1XlXGfwqmjviKuahV4Ow6K2cCVBlCGQAg","name":"chunky_core_mining_base","source":"EarendelDevelopers/factorio-mods issue 319","note":"SE 0.6.113 chunky base"},
            {"id":"1vjkxLhfwbmAmB_EA3MEdLSJ5PfK1JYzT","name":"factorissimo_k2se","source":"notnotmelon/factorissimo issue 268","note":"K2SE bundle; probably advanced"},
            {"id":"1jzqDa-mYzDRRNeyTb7_3arCnRdhgHgW6","name":"old_ltn_se_base","source":"nihilistzsche/LtnManager issue 58","note":"Very old SE base; fallback only"}
          ]
          JSON

          cat > work/download_parse.py <<'PY'
          from __future__ import annotations
          import hashlib, io, json, pathlib, struct, subprocess, zipfile

          P=pathlib.Path
          candidates=json.loads(P('work/candidates.json').read_text())
          results=[]

          class Reader:
              def __init__(self,data): self.data=data; self.offset=0
              def u8(self): v=self.data[self.offset]; self.offset+=1; return v
              def u16(self): v=struct.unpack_from('<H',self.data,self.offset)[0]; self.offset+=2; return v
              def u32(self): v=struct.unpack_from('<I',self.data,self.offset)[0]; self.offset+=4; return v
              def version(self): return (self.u16(),self.u16(),self.u16(),self.u16())
              def opt(self,bits,fv):
                  if fv>(0,14,14,0):
                      first=self.u8()
                      if first!=0xff:return first
                  return self.u16() if bits==16 else self.u32()
              def text(self,fv):
                  n=self.opt(32,fv); raw=self.data[self.offset:self.offset+n]; self.offset+=n
                  return raw.decode('utf-8','replace')
              def version48(self,fv): return (self.opt(16,fv),self.opt(16,fv),self.opt(16,fv))
          def parse_header(data):
              r=Reader(data);fv=r.version();r.u8()
              out={'factorio_version_full':'.'.join(map(str,fv)),'factorio_version':'.'.join(map(str,fv[:3])),'save_name':r.text(fv),'campaign':r.text(fv),'base_mod':r.text(fv)}
              out['difficulty']=r.u8();out['finished']=bool(r.u8());out['player_won']=bool(r.u8());out['next_level']=r.text(fv)
              out['can_continue']=bool(r.u8());out['finished_but_continuing']=bool(r.u8());out['saving_replay']=bool(r.u8());out['allow_non_admin_debug']=bool(r.u8())
              out['loaded_from']='.'.join(map(str,r.version48(fv)));out['loaded_from_build']=r.u32() if fv[0]>=2 else r.u16();out['allowed_commands']=bool(r.u8())
              if fv[0]>=2:r.offset+=4
              mods={}
              for _ in range(r.opt(32,fv)):
                  name=r.text(fv);version='.'.join(map(str,r.version48(fv)));r.u32();mods[name]=version
              out['mods']=mods;return out

          def inspect_zip_bytes(data:bytes, trail:list[str], depth:int=0):
              if depth>3:return None
              try:z=zipfile.ZipFile(io.BytesIO(data))
              except Exception:return None
              with z:
                  names=z.namelist()
                  init=next((n for n in names if n.endswith('/level-init.dat') or n=='level-init.dat'),None)
                  level=next((n for n in names if n.endswith('/level.dat') or n=='level.dat'),None)
                  if init and level:
                      return {'data':data,'zip':z,'names':names,'init':init,'trail':trail}
                  nested=[]
                  for info in z.infolist():
                      if info.is_dir() or not info.filename.lower().endswith(('.zip','.sav')):continue
                      if info.file_size<100000 or info.file_size>700000000:continue
                      nested.append(info)
                  nested.sort(key=lambda x:(0 if any(w in x.filename.lower() for w in ('save','space','se','rocket','autosave')) else 1,x.file_size))
                  for info in nested:
                      try:child=z.read(info)
                      except Exception:continue
                      found=inspect_zip_bytes(child,trail+[info.filename],depth+1)
                      if found:return found
              return None

          for c in candidates:
              outer=P('work/downloads')/(c['name']+'.bin');rec=dict(c)
              try:
                  proc=subprocess.run(['gdown','--no-cookies','-O',str(outer),c['id']],text=True,capture_output=True,timeout=1200)
                  rec['download_stdout']=proc.stdout[-3000:];rec['download_stderr']=proc.stderr[-3000:]
                  if proc.returncode!=0:raise RuntimeError(f'gdown exit {proc.returncode}')
                  if not outer.exists() or outer.stat().st_size<100000:raise RuntimeError('download missing or too small')
                  rec['outer_bytes']=outer.stat().st_size
                  with outer.open('rb') as f: rec['outer_magic']=f.read(32).hex()
                  try:
                      with zipfile.ZipFile(outer) as oz:
                          listing='\n'.join(f'{i.file_size:12d} {i.filename}' for i in oz.infolist())
                          P('published/listings',c['name']+'.txt').write_text(listing)
                  except Exception as exc:
                      rec['outer_listing_error']=repr(exc)
                  data=outer.read_bytes()
                  found=inspect_zip_bytes(data,[outer.name])
                  if not found:raise RuntimeError('no Factorio save found directly or in nested ZIPs')
                  actual=P('work/actual-saves')/(c['name']+'.zip');actual.write_bytes(found['data'])
                  rec['actual_path']=str(actual);rec['nesting_trail']=found['trail'];rec['actual_bytes']=len(found['data'])
                  h=parse_header(found['zip'].read(found['init']));rec['header']=h;rec['se_version']=h['mods'].get('space-exploration');rec['k2_version']=h['mods'].get('Krastorio2');rec['mod_count']=len(h['mods'])
                  script_name=next((n for n in found['names'] if n.endswith('/script.dat') or n=='script.dat'),None)
                  if script_name:
                      script=found['zip'].read(script_name)
                      rec['marker_counts']={label:script.count(marker) for label,marker in {
                          'rocket_science':b'se-rocket-science-pack','launch_pad':b'se-rocket-launch-pad','cargo_section':b'se-cargo-rocket-section','nauvis_orbit':b'Nauvis Orbit','space_lab':b'se-space-science-lab','space_scaffold':b'se-space-platform-scaffold'}.items()}
                  preview=next((n for n in found['names'] if n.endswith('/preview.jpg') or n=='preview.jpg'),None)
                  if preview:
                      out=P('published/previews')/(c['name']+'.jpg');out.write_bytes(found['zip'].read(preview));rec['preview']='previews/'+out.name
                  hasher=hashlib.sha256();
                  with actual.open('rb') as f:
                      for chunk in iter(lambda:f.read(1024*1024),b''):hasher.update(chunk)
                  rec['sha256']=hasher.hexdigest()
              except Exception as exc:rec['error']=repr(exc)
              results.append(rec)
          P('published/header-results.json').write_text(json.dumps(results,indent=2))
          P('published/header-summary.txt').write_text('\n\n'.join(f"{r['name']}: outer={r.get('outer_bytes')} actual={r.get('actual_bytes')} trail={r.get('nesting_trail')} Factorio={r.get('header',{}).get('factorio_version')} SE={r.get('se_version')} K2={r.get('k2_version')} error={r.get('error')}\nmarkers={r.get('marker_counts')}" for r in results))
          print(P('published/header-summary.txt').read_text())
          PY
          python3 work/download_parse.py | tee published/header-console.txt

      - name: Headless-load every usable candidate and measure progression
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat > work/headless.py <<'PY'
          from __future__ import annotations
          import json,pathlib,subprocess,urllib.request,urllib.parse,os,time,socket,struct,tarfile
          P=pathlib.Path; headers=json.loads(P('published/header-results.json').read_text());reports=[]
          fcache=P('work/factorio-cache');fcache.mkdir(exist_ok=True);mcache=P('work/mod-cache');mcache.mkdir(exist_ok=True)
          def download(url,dest,timeout=600):
              req=urllib.request.Request(url,headers={'User-Agent':'SE-save-inspector/1.0'})
              with urllib.request.urlopen(req,timeout=timeout) as r,dest.open('wb') as f:
                  while True:
                      chunk=r.read(1024*1024)
                      if not chunk:break
                      f.write(chunk)
          def factorio(version):
              root=fcache/version;binary=root/'factorio/bin/x64/factorio'
              if binary.exists():return binary
              root.mkdir(parents=True,exist_ok=True);archive=root/'factorio.tar.xz';download(f'https://factorio.com/get-download/{version}/headless/linux64',archive)
              with tarfile.open(archive,'r:xz') as t:t.extractall(root)
              return binary
          builtin={'base','core','elevated-rails','quality','space-age','expansion-shaders','freezing','rail-bridges','segmented-units','space-travel','spoiling'}
          def mod(name,version,dest):
              if name in builtin:return
              cached=mcache/f'{name}_{version}.zip'
              if not cached.exists():
                  api='https://mods.factorio.com/api/mods/'+urllib.parse.quote(name,safe='')+'/full'
                  with urllib.request.urlopen(urllib.request.Request(api,headers={'User-Agent':'SE-save-inspector/1.0'}),timeout=90) as r:meta=json.load(r)
                  rel=next((x for x in meta.get('releases',[]) if x.get('version')==version),None)
                  if not rel:raise RuntimeError(f'exact release missing: {name} {version}')
                  download(urllib.parse.urljoin('https://mods.factorio.com',rel['download_url']),cached)
              target=dest/cached.name
              if not target.exists():os.link(cached,target)
          def pkt(i,t,b):
              payload=struct.pack('<ii',i,t)+b.encode()+b'\0\0';return struct.pack('<i',len(payload))+payload
          def recv(s):
              h=s.recv(4)
              if len(h)!=4:raise RuntimeError('short RCON header')
              n=struct.unpack('<i',h)[0];d=b''
              while len(d)<n:
                  c=s.recv(n-len(d))
                  if not c:raise RuntimeError('RCON closed')
                  d+=c
              return struct.unpack_from('<ii',d,0)+(d[8:-2].decode('utf-8','replace'),)
          lua=r'''
          local out={tick=game.tick,hours=game.tick/216000,players={},forces={},surfaces={},active_recipes={},rocket_science_machines=0,rocket_science_working=0}
          local recipes={};local realforces={}
          for _,f in pairs(game.forces) do if f.name~="enemy" and f.name~="neutral" then realforces[f.name]=true end end
          for _,f in pairs(game.forces) do
            local fr={name=f.name,rockets_launched=f.rockets_launched or 0,rocket_science_output=0,rocket_science_input=0,research={}}
            local ok,v=pcall(function()return f.item_production_statistics.get_output_count("se-rocket-science-pack")end);if ok then fr.rocket_science_output=v end
            local ok2,v2=pcall(function()return f.item_production_statistics.get_input_count("se-rocket-science-pack")end);if ok2 then fr.rocket_science_input=v2 end
            for n,t in pairs(f.technologies) do if t.researched and (string.find(n,"rocket",1,true) or string.find(n,"space",1,true)) then table.insert(fr.research,n) end end
            table.sort(fr.research);table.insert(out.forces,fr)
          end
          for _,p in pairs(game.players) do table.insert(out.players,{name=p.name,force=p.force.name,surface=p.surface and p.surface.name or nil,position=p.position}) end
          for _,s in pairs(game.surfaces) do
            local sr={name=s.name,index=s.index,chunks=0,player_entities=0,entities={},rocket_science_machines=0,rocket_science_support={}}
            for _ in s.get_chunks() do sr.chunks=sr.chunks+1 end
            for fn,_ in pairs(realforces) do local ok,c=pcall(function()return s.count_entities_filtered{force=fn}end);if ok then sr.player_entities=sr.player_entities+c end end
            for _,en in pairs({"se-rocket-launch-pad","se-rocket-landing-pad","se-space-science-lab","se-space-assembling-machine","se-space-manufactory","rocket-silo"}) do local ok,c=pcall(function()return s.count_entities_filtered{name=en}end);sr.entities[en]=ok and c or -1 end
            for _,e in pairs(s.find_entities_filtered{type={"assembling-machine","furnace","rocket-silo"}}) do
              local ok,r=pcall(function()return e.get_recipe()end)
              if ok and r then
                recipes[r.name]=(recipes[r.name] or 0)+1
                if r.name=="se-rocket-science-pack" then
                  out.rocket_science_machines=out.rocket_science_machines+1;sr.rocket_science_machines=sr.rocket_science_machines+1
                  local oks,st=pcall(function()return e.status end);if oks and st==defines.entity_status.working then out.rocket_science_working=out.rocket_science_working+1 end
                end
                if string.find(r.name,"satellite",1,true) or string.find(r.name,"rocket",1,true) then sr.rocket_science_support[r.name]=(sr.rocket_science_support[r.name] or 0)+1 end
              end
            end
            table.insert(out.surfaces,sr)
          end
          for n,c in pairs(recipes) do if string.find(n,"rocket",1,true) or string.find(n,"satellite",1,true) or string.find(n,"science",1,true) then out.active_recipes[n]=c end end
          local encode=(helpers and helpers.table_to_json) or game.table_to_json;rcon.print(encode(out))
          '''
          usable=[r for r in headers if r.get('header') and r.get('se_version')]
          for idx,r in enumerate(usable):
              name=r['name'];rep={'name':name,'source':r['source'],'note':r['note'],'header':r['header'],'bytes':r.get('actual_bytes'),'sha256':r.get('sha256')};proc=None
              try:
                  binary=factorio(r['header']['factorio_version']);moddir=P('work/run',name,'mods');moddir.mkdir(parents=True,exist_ok=True)
                  for n,v in r['header']['mods'].items():mod(n,v,moddir)
                  (moddir/'mod-list.json').write_text(json.dumps({'mods':[{'name':n,'enabled':True} for n in r['header']['mods']]},indent=2))
                  settings=P('work/run',name,'server-settings.json');settings.parent.mkdir(parents=True,exist_ok=True);settings.write_text(json.dumps({'name':'inspect','visibility':{'public':False,'lan':False},'require_user_verification':False,'max_players':0,'autosave_interval':0,'allow_commands':'admins-only'}))
                  log=P('published/reports',name+'-server.log');port=27200+idx
                  with log.open('w') as lf:proc=subprocess.Popen([str(binary),'--start-server',r['actual_path'],'--mod-directory',str(moddir),'--server-settings',str(settings),'--rcon-port',str(port),'--rcon-password','inspect'],stdout=lf,stderr=subprocess.STDOUT)
                  for _ in range(360):
                      if proc.poll() is not None:break
                      text=log.read_text(errors='replace') if log.exists() else ''
                      if 'Starting RCON interface' in text:break
                      time.sleep(1)
                  text=log.read_text(errors='replace') if log.exists() else ''
                  if 'Starting RCON interface' not in text:raise RuntimeError('load failed: '+text[-5000:])
                  with socket.create_connection(('127.0.0.1',port),timeout=20) as s:
                      s.settimeout(60);s.sendall(pkt(1,3,'inspect'));auth=recv(s)
                      if auth[0]==-1:raise RuntimeError('RCON auth failed')
                      s.sendall(pkt(2,2,'/sc '+lua));body=recv(s)[2].strip();start=body.find('{');end=body.rfind('}')
                      if start<0 or end<start:raise RuntimeError('no JSON in RCON response: '+body[:1000])
                      rep['progression']=json.loads(body[start:end+1])
              except Exception as exc:rep['error']=repr(exc)
              finally:
                  if proc and proc.poll() is None:
                      proc.terminate()
                      try:proc.wait(20)
                      except:proc.kill()
              reports.append(rep);P('published/reports',name+'.json').write_text(json.dumps(rep,indent=2,sort_keys=True))
          def metrics(r):
              p=r.get('progression') or {};forces=p.get('forces') or [];output=max([f.get('rocket_science_output',0) or 0 for f in forces] or [0]);machines=p.get('rocket_science_machines',0) or 0;working=p.get('rocket_science_working',0) or 0;orbit=0;other=0;pads=0
              for s in p.get('surfaces') or []:
                  low=s.get('name','').lower();pe=s.get('player_entities',0) or 0
                  if 'orbit' in low:orbit+=pe
                  if low!='nauvis':other+=pe
                  pads+=(s.get('entities') or {}).get('se-rocket-launch-pad',0) or 0
              full_scale=machines>=2 and output>=1000
              score=(300 if full_scale else 0)+min(machines,12)*25+min(output/500,100)+pads*15+(180 if orbit==0 else 80 if orbit<100 else -min(orbit/10,180))
              return {'rocket_science_output':output,'rocket_science_machines':machines,'rocket_science_working':working,'orbit_player_entities':orbit,'non_nauvis_player_entities':other,'launchpads':pads,'full_scale_cutoff_pass':full_scale,'score':score}
          for r in reports:r['metrics']=metrics(r)
          reports.sort(key=lambda r:r['metrics']['score'],reverse=True);P('published/progression-results.json').write_text(json.dumps(reports,indent=2,sort_keys=True))
          valid=[r for r in reports if r.get('progression') and r['metrics']['full_scale_cutoff_pass']]
          if valid:
              best=valid[0];P('published/selected.json').write_text(json.dumps(best,indent=2,sort_keys=True));P('published/selected-name.txt').write_text(best['name']);source=P('work/actual-saves')/(best['name']+'.zip')
              subprocess.run(['split','-b','45M','-d','-a','3',str(source),str(P('published/chunks')/(best['name']+'.zip.part'))],check=True);P('published/chunks/README.txt').write_text(f"cat {best['name']}.zip.part* > {best['name']}.zip\n")
          print(json.dumps(reports,indent=2,sort_keys=True))
          PY
          python3 work/headless.py | tee published/progression-console.txt

      - name: Publish reports and any selected save chunks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$RESULT_BRANCH"
          rm -rf tmp-se-drive-scan
          mkdir -p tmp-se-drive-scan
          cp -a published/. tmp-se-drive-scan/
          git add -f tmp-se-drive-scan
          git commit -m 'Inspect nested public Space Exploration save bundles'
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
