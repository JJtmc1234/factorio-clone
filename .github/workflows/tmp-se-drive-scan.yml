name: Temporary public SE Drive candidate inspection

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  RESULT_BRANCH: "tmp-se-drive-result-20260824"

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download public candidate saves and parse Factorio headers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work published
          mkdir -p work/saves work/headers published/reports published/previews published/chunks
          python3 -m pip install --quiet --upgrade gdown

          cat > work/candidates.json <<'JSON'
          [
            {"id":"1zA_uoOIYn3dpO92empFJY0WPg7XSY29k","name":"rampant_starter_planet_only","source":"veden/Rampant issue 66","note":"SE+K2; author says only starter planet and some satellites, no other planets visited"},
            {"id":"1hyn5Do8q8xDSUK4Aqe6B8uRGE6gGfcJG","name":"blueprint_sandbox_cargo_rocket","source":"EarendelDevelopers/factorio-mods issue 275","note":"SE 0.6.98; cargo rocket launch bug"},
            {"id":"1Tin_CrL075mHPVhDVdZtFErzZb86Hxbo","name":"miniloader_migration_06146","source":"hgschmie/factorio-miniloader-redux issue 31","note":"Known SE 0.6.146 migration save"},
            {"id":"1nScbABVE1hugI9Oj5Li6XRotivrJuBsp","name":"migration_workaround_0754","source":"EarendelDevelopers/factorio-mods issue 392","note":"Migrated 0.6 to 0.7 save"},
            {"id":"1XlXGfwqmjviKuahV4Ow6K2cCVBlCGQAg","name":"chunky_core_mining_base","source":"EarendelDevelopers/factorio-mods issue 319","note":"SE 0.6.113 chunky base"},
            {"id":"1vjkxLhfwbmAmB_EA3MEdLSJ5PfK1JYzT","name":"factorissimo_k2se","source":"notnotmelon/factorissimo issue 268","note":"K2SE migrated/current; likely advanced"},
            {"id":"1jzqDa-mYzDRRNeyTb7_3arCnRdhgHgW6","name":"old_ltn_se_base","source":"nihilistzsche/LtnManager issue 58","note":"Very old SE base; fallback only"}
          ]
          JSON

          cat > work/download_and_parse.py <<'PY'
          from __future__ import annotations
          import json, pathlib, struct, subprocess, zipfile, hashlib, re, shutil

          P = pathlib.Path
          candidates = json.loads(P('work/candidates.json').read_text())
          results=[]

          class Reader:
              def __init__(self,data): self.data=data; self.offset=0
              def u8(self): v=self.data[self.offset]; self.offset+=1; return v
              def u16(self): v=struct.unpack_from('<H',self.data,self.offset)[0]; self.offset+=2; return v
              def u32(self): v=struct.unpack_from('<I',self.data,self.offset)[0]; self.offset+=4; return v
              def version(self): return (self.u16(),self.u16(),self.u16(),self.u16())
              def opt(self,bits,fv):
                  if fv>(0,14,14,0):
                      first=self.u8()
                      if first!=0xff:return first
                  return self.u16() if bits==16 else self.u32()
              def string(self,fv):
                  n=self.opt(32,fv); raw=self.data[self.offset:self.offset+n]; self.offset+=n
                  return raw.decode('utf-8','replace')
              def version48(self,fv): return (self.opt(16,fv),self.opt(16,fv),self.opt(16,fv))

          def parse_header(data):
              r=Reader(data); fv=r.version(); r.u8()
              out={'factorio_version_full':'.'.join(map(str,fv)),'factorio_version':'.'.join(map(str,fv[:3])),'save_name':r.string(fv),'campaign':r.string(fv),'base_mod':r.string(fv)}
              out['difficulty']=r.u8(); out['finished']=bool(r.u8()); out['player_won']=bool(r.u8()); out['next_level']=r.string(fv)
              out['can_continue']=bool(r.u8()); out['finished_but_continuing']=bool(r.u8()); out['saving_replay']=bool(r.u8()); out['allow_non_admin_debug']=bool(r.u8())
              out['loaded_from']='.'.join(map(str,r.version48(fv))); out['loaded_from_build']=r.u32() if fv[0]>=2 else r.u16(); out['allowed_commands']=bool(r.u8())
              if fv[0]>=2:r.offset+=4
              mods={}
              for _ in range(r.opt(32,fv)):
                  name=r.string(fv); version='.'.join(map(str,r.version48(fv))); crc=r.u32(); mods[name]=version
              out['mods']=mods; return out

          for c in candidates:
              save=P('work/saves')/(c['name']+'.zip')
              rec=dict(c); rec['path']=str(save)
              try:
                  proc=subprocess.run(['gdown','--fuzzy','--no-cookies','-O',str(save),f"https://drive.google.com/file/d/{c['id']}/view"],text=True,capture_output=True,timeout=900)
                  rec['gdown_stdout']=proc.stdout[-2000:]; rec['gdown_stderr']=proc.stderr[-2000:]
                  if proc.returncode!=0: raise RuntimeError(f'gdown exit {proc.returncode}')
                  if not save.exists() or save.stat().st_size<100000: raise RuntimeError('download missing or too small')
                  rec['bytes']=save.stat().st_size; rec['sha256']=hashlib.sha256(save.read_bytes()).hexdigest()
                  with zipfile.ZipFile(save) as zf:
                      names=zf.namelist(); init=next((n for n in names if n.endswith('/level-init.dat') or n=='level-init.dat'),None); level=next((n for n in names if n.endswith('/level.dat') or n=='level.dat'),None)
                      if not init or not level: raise RuntimeError('download is not a Factorio save ZIP')
                      h=parse_header(zf.read(init)); rec['header']=h; rec['se_version']=h['mods'].get('space-exploration'); rec['k2_version']=h['mods'].get('Krastorio2'); rec['mod_count']=len(h['mods'])
                      script_name=next((n for n in names if n.endswith('/script.dat') or n=='script.dat'),None)
                      if script_name:
                          script=zf.read(script_name)
                          rec['marker_counts']={label:script.count(marker) for label,marker in {
                              'rocket_science':b'se-rocket-science-pack','launch_pad':b'se-rocket-launch-pad','cargo_section':b'se-cargo-rocket-section','nauvis_orbit':b'Nauvis Orbit','space_lab':b'se-space-science-lab','space_scaffold':b'se-space-platform-scaffold'
                          }.items()}
                      preview=next((n for n in names if n.endswith('/preview.jpg') or n=='preview.jpg'),None)
                      if preview:
                          out=P('published/previews')/(c['name']+'.jpg'); out.write_bytes(zf.read(preview)); rec['preview']='previews/'+out.name
                  P('work/headers',c['name']+'.json').write_text(json.dumps(rec,indent=2))
              except Exception as exc:
                  rec['error']=repr(exc)
              results.append(rec)
          P('published/header-results.json').write_text(json.dumps(results,indent=2))
          P('published/header-summary.txt').write_text('\n\n'.join(
              f"{r['name']}: bytes={r.get('bytes')} Factorio={r.get('header',{}).get('factorio_version')} SE={r.get('se_version')} K2={r.get('k2_version')} mods={r.get('mod_count')} error={r.get('error')}\nmarkers={r.get('marker_counts')}"
              for r in results
          ))
          print(P('published/header-summary.txt').read_text())
          PY
          python3 work/download_and_parse.py | tee published/header-console.txt

      - name: Headless-load promising candidates and measure real progression
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat > work/inspect_candidates.py <<'PY'
          from __future__ import annotations
          import json, pathlib, subprocess, urllib.request, urllib.parse, shutil, os, time, socket, struct, re, tarfile

          P=pathlib.Path
          headers=json.loads(P('published/header-results.json').read_text())
          reports=[]
          cache_factorio=P('work/factorio-cache'); cache_factorio.mkdir(exist_ok=True)
          cache_mods=P('work/mod-cache'); cache_mods.mkdir(exist_ok=True)

          def download(url,dest,timeout=300):
              req=urllib.request.Request(url,headers={'User-Agent':'SE-save-inspector/1.0'})
              with urllib.request.urlopen(req,timeout=timeout) as r, dest.open('wb') as f:
                  while True:
                      chunk=r.read(1024*1024)
                      if not chunk:break
                      f.write(chunk)

          def ensure_factorio(version):
              root=cache_factorio/version
              binary=root/'factorio/bin/x64/factorio'
              if binary.exists():return binary
              root.mkdir(parents=True,exist_ok=True)
              archive=root/'factorio.tar.xz'
              download(f'https://factorio.com/get-download/{version}/headless/linux64',archive,600)
              with tarfile.open(archive,'r:xz') as tf: tf.extractall(root)
              if not binary.exists():raise RuntimeError('Factorio binary missing after extract')
              return binary

          builtin={'base','core','elevated-rails','quality','space-age','expansion-shaders','freezing','rail-bridges','segmented-units','space-travel','spoiling'}
          def ensure_mod(name,version,dest_dir):
              if name in builtin:return
              cached=cache_mods/f'{name}_{version}.zip'
              if not cached.exists():
                  api='https://mods.factorio.com/api/mods/'+urllib.parse.quote(name,safe='')+'/full'
                  with urllib.request.urlopen(urllib.request.Request(api,headers={'User-Agent':'SE-save-inspector/1.0'}),timeout=90) as r: meta=json.load(r)
                  release=next((x for x in meta.get('releases',[]) if x.get('version')==version),None)
                  if not release:raise RuntimeError(f'exact mod release unavailable: {name} {version}')
                  url=urllib.parse.urljoin('https://mods.factorio.com',release['download_url'])
                  download(url,cached,600)
              target=dest_dir/cached.name
              if not target.exists(): os.link(cached,target)

          def packet(request_id,packet_type,body):
              payload=struct.pack('<ii',request_id,packet_type)+body.encode()+b'\x00\x00';return struct.pack('<i',len(payload))+payload
          def receive(sock):
              hdr=sock.recv(4)
              if len(hdr)!=4:raise RuntimeError('short RCON header')
              n=struct.unpack('<i',hdr)[0];data=b''
              while len(data)<n:
                  chunk=sock.recv(n-len(data))
                  if not chunk:raise RuntimeError('RCON closed')
                  data+=chunk
              rid,typ=struct.unpack_from('<ii',data,0);return rid,typ,data[8:-2].decode('utf-8','replace')

          lua=r'''
          local report={tick=game.tick,hours=game.tick/216000,players={},forces={},surfaces={},active_recipes={},rocket_science_machines=0,rocket_science_working=0}
          local recipe_counts={}
          local force_names={}
          for _,f in pairs(game.forces) do if f.name~="enemy" and f.name~="neutral" then force_names[f.name]=true end end
          for _,f in pairs(game.forces) do
            local fr={name=f.name,rockets_launched=f.rockets_launched or 0,rocket_science_output=0,rocket_science_input=0,research={}}
            local ok,v=pcall(function() return f.item_production_statistics.get_output_count("se-rocket-science-pack") end);if ok then fr.rocket_science_output=v end
            local ok2,v2=pcall(function() return f.item_production_statistics.get_input_count("se-rocket-science-pack") end);if ok2 then fr.rocket_science_input=v2 end
            for n,t in pairs(f.technologies) do if t.researched and (string.find(n,"rocket",1,true) or string.find(n,"space",1,true)) then table.insert(fr.research,n) end end
            table.sort(fr.research);table.insert(report.forces,fr)
          end
          for _,p in pairs(game.players) do table.insert(report.players,{name=p.name,force=p.force.name,surface=p.surface and p.surface.name or nil,position=p.position}) end
          for _,s in pairs(game.surfaces) do
            local sr={name=s.name,index=s.index,chunks=0,player_entities=0,entities={},rocket_science_machines=0}
            for _ in s.get_chunks() do sr.chunks=sr.chunks+1 end
            for fname,_ in pairs(force_names) do local ok,c=pcall(function() return s.count_entities_filtered{force=fname} end);if ok then sr.player_entities=sr.player_entities+c end end
            for _,ename in pairs({"se-rocket-launch-pad","se-rocket-landing-pad","se-space-science-lab","se-space-assembling-machine","se-space-manufactory","rocket-silo"}) do local ok,c=pcall(function() return s.count_entities_filtered{name=ename} end);sr.entities[ename]=ok and c or -1 end
            for _,e in pairs(s.find_entities_filtered{type={"assembling-machine","furnace","rocket-silo"}}) do
              local ok,r=pcall(function() return e.get_recipe() end)
              if ok and r then
                recipe_counts[r.name]=(recipe_counts[r.name] or 0)+1
                if r.name=="se-rocket-science-pack" then
                  report.rocket_science_machines=report.rocket_science_machines+1;sr.rocket_science_machines=sr.rocket_science_machines+1
                  local okst,st=pcall(function() return e.status end);if okst and st==defines.entity_status.working then report.rocket_science_working=report.rocket_science_working+1 end
                end
              end
            end
            table.insert(report.surfaces,sr)
          end
          for n,c in pairs(recipe_counts) do if string.find(n,"rocket",1,true) or string.find(n,"satellite",1,true) or string.find(n,"science",1,true) then report.active_recipes[n]=c end end
          local encode=(helpers and helpers.table_to_json) or game.table_to_json
          rcon.print(encode(report))
          '''

          # Favor saves likely to be around the first-space boundary; skip obvious giant endgames first.
          candidates=[r for r in headers if r.get('header') and r.get('se_version')]
          candidates.sort(key=lambda r:(0 if r['name'] in ('rampant_starter_planet_only','blueprint_sandbox_cargo_rocket','miniloader_migration_06146') else 1,r.get('bytes',0)))
          for idx,r in enumerate(candidates[:6]):
              name=r['name'];out={'name':name,'source':r.get('source'),'note':r.get('note'),'header':r.get('header'),'bytes':r.get('bytes')}
              proc=None
              try:
                  fv=r['header']['factorio_version']; binary=ensure_factorio(fv)
                  moddir=P('work/run',name,'mods');moddir.mkdir(parents=True,exist_ok=True)
                  for mod,ver in r['header']['mods'].items():ensure_mod(mod,ver,moddir)
                  (moddir/'mod-list.json').write_text(json.dumps({'mods':[{'name':m,'enabled':True} for m in r['header']['mods']]},indent=2))
                  settings=P('work/run',name,'server-settings.json');settings.parent.mkdir(parents=True,exist_ok=True);settings.write_text(json.dumps({'name':'inspect','visibility':{'public':False,'lan':False},'require_user_verification':False,'max_players':0,'autosave_interval':0,'allow_commands':'admins-only'}))
                  log=P('published/reports',name+'-server.log');port=27100+idx
                  with log.open('w') as lf:
                      proc=subprocess.Popen([str(binary),'--start-server',r['path'],'--mod-directory',str(moddir),'--server-settings',str(settings),'--rcon-port',str(port),'--rcon-password','inspect'],stdout=lf,stderr=subprocess.STDOUT)
                  for _ in range(300):
                      if proc.poll() is not None:break
                      text=log.read_text(errors='replace') if log.exists() else ''
                      if 'Starting RCON interface' in text:break
                      time.sleep(1)
                  text=log.read_text(errors='replace') if log.exists() else ''
                  if 'Starting RCON interface' not in text:raise RuntimeError('Factorio failed before RCON: '+text[-4000:])
                  with socket.create_connection(('127.0.0.1',port),timeout=20) as sock:
                      sock.settimeout(45);sock.sendall(packet(1,3,'inspect'));auth=receive(sock)
                      if auth[0]==-1:raise RuntimeError('RCON auth failed')
                      sock.sendall(packet(2,2,'/sc '+lua));resp=receive(sock)[2].strip();out['rcon_raw']=resp[:2000]
                      start=resp.find('{');end=resp.rfind('}')
                      if start<0 or end<start:raise RuntimeError('RCON did not return JSON')
                      out['progression']=json.loads(resp[start:end+1])
              except Exception as exc:
                  out['error']=repr(exc)
              finally:
                  if proc and proc.poll() is None:
                      proc.terminate()
                      try:proc.wait(20)
                      except:proc.kill()
              P('published/reports',name+'.json').write_text(json.dumps(out,indent=2,sort_keys=True));reports.append(out)

          def metrics(r):
              p=r.get('progression') or {};forces=p.get('forces') or []
              output=max([f.get('rocket_science_output',0) or 0 for f in forces] or [0]);machines=p.get('rocket_science_machines',0) or 0;working=p.get('rocket_science_working',0) or 0
              orbit_entities=0;non_nauvis_entities=0;launchpads=0
              for s in p.get('surfaces') or []:
                  low=s.get('name','').lower();pe=s.get('player_entities',0) or 0
                  if 'orbit' in low:orbit_entities+=pe
                  if low!='nauvis':non_nauvis_entities+=pe
                  launchpads+=(s.get('entities') or {}).get('se-rocket-launch-pad',0) or 0
              score=(min(machines,12)*20+min(output/1000,100)+launchpads*15-working*0)
              if orbit_entities==0:score+=150
              elif orbit_entities<100:score+=60
              else:score-=min(orbit_entities/10,150)
              return {'rocket_science_output':output,'rocket_science_machines':machines,'working':working,'orbit_player_entities':orbit_entities,'non_nauvis_player_entities':non_nauvis_entities,'launchpads':launchpads,'score':score}
          for r in reports:r['metrics']=metrics(r)
          reports.sort(key=lambda r:r['metrics']['score'],reverse=True)
          P('published/progression-results.json').write_text(json.dumps(reports,indent=2,sort_keys=True))
          if reports:
              best=reports[0];P('published/selected.json').write_text(json.dumps(best,indent=2,sort_keys=True));P('published/selected-name.txt').write_text(best['name'])
              source=P('work/saves')/(best['name']+'.zip')
              if source.exists():
                  # Split into GitHub-safe pieces so the actual save can be reconstructed locally.
                  subprocess.run(['split','-b','45M','-d','-a','3',str(source),str(P('published/chunks')/(best['name']+'.zip.part'))],check=True)
                  P('published/chunks/README.txt').write_text(f"Reassemble with: cat {best['name']}.zip.part* > {best['name']}.zip\n")
          print(json.dumps(reports,indent=2,sort_keys=True))
          PY
          python3 work/inspect_candidates.py | tee published/progression-console.txt

      - name: Publish reports and selected save chunks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$RESULT_BRANCH"
          rm -rf tmp-se-drive-scan
          mkdir -p tmp-se-drive-scan
          cp -a published/. tmp-se-drive-scan/
          git add -f tmp-se-drive-scan
          git commit -m 'Inspect public Space Exploration save candidates'
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
