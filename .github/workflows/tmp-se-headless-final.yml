name: Temporary final SE candidate headless inspection

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  RESULT_BRANCH: tmp-se-headless-final-result-20260824

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Download save, exact game, and exact mods
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work published
          mkdir -p work/mods published/chunks
          python3 -m pip install --quiet --upgrade gdown
          gdown --no-cookies -O work/candidate.zip 1nScbABVE1hugI9Oj5Li6XRotivrJuBsp

          cat > work/setup.py <<'PY'
          import json, pathlib, struct, urllib.request, urllib.parse, tarfile, shutil
          P=pathlib.Path
          with __import__('zipfile').ZipFile('work/candidate.zip') as z:
            init=next(n for n in z.namelist() if n.endswith('/level-init.dat') or n=='level-init.dat')
            d=z.read(init)
          class R:
            def __init__(self,d):self.d=d;self.o=0
            def u8(self):v=self.d[self.o];self.o+=1;return v
            def u16(self):v=struct.unpack_from('<H',self.d,self.o)[0];self.o+=2;return v
            def u32(self):v=struct.unpack_from('<I',self.d,self.o)[0];self.o+=4;return v
            def ver(self):return self.u16(),self.u16(),self.u16(),self.u16()
            def opt(self,b,fv):
              if fv>(0,14,14,0):
                x=self.u8()
                if x!=255:return x
              return self.u16() if b==16 else self.u32()
            def text(self,fv):
              n=self.opt(32,fv);v=self.d[self.o:self.o+n];self.o+=n;return v.decode('utf-8','replace')
            def v48(self,fv):return self.opt(16,fv),self.opt(16,fv),self.opt(16,fv)
          r=R(d);fv=r.ver();r.u8();save_name=r.text(fv);campaign=r.text(fv);base_mod=r.text(fv)
          r.u8();r.u8();r.u8();r.text(fv);r.u8();r.u8();r.u8();r.u8();loaded='.'.join(map(str,r.v48(fv)));build=r.u16();r.u8()
          mods={}
          for _ in range(r.opt(32,fv)):
            name=r.text(fv);version='.'.join(map(str,r.v48(fv)));r.u32();mods[name]=version
          version='.'.join(map(str,fv[:3]))
          header={'factorio_version':version,'factorio_version_full':'.'.join(map(str,fv)),'save_name':save_name,'campaign':campaign,'base_mod':base_mod,'loaded_from':loaded,'loaded_from_build':build,'mods':mods}
          P('published/header.json').write_text(json.dumps(header,indent=2))

          def download(url,dest,timeout=900):
            req=urllib.request.Request(url,headers={'User-Agent':'JJ-SE-save-inspector/1.0'})
            with urllib.request.urlopen(req,timeout=timeout) as src,dest.open('wb') as out:
              while True:
                chunk=src.read(1024*1024)
                if not chunk:break
                out.write(chunk)

          archive=P('work/factorio.tar.xz')
          download(f'https://factorio.com/get-download/{version}/headless/linux64',archive)
          with tarfile.open(archive,'r:xz') as t:t.extractall('work')

          builtin={'base','core'}
          report=[]
          for name,ver in mods.items():
            if name in builtin:
              report.append({'name':name,'version':ver,'status':'builtin'});continue
            try:
              api='https://mods.factorio.com/api/mods/'+urllib.parse.quote(name,safe='')+'/full'
              with urllib.request.urlopen(urllib.request.Request(api,headers={'User-Agent':'JJ-SE-save-inspector/1.0'}),timeout=90) as response:meta=json.load(response)
              rel=next((x for x in meta.get('releases',[]) if x.get('version')==ver),None)
              if not rel:raise RuntimeError('exact release missing')
              url=urllib.parse.urljoin('https://mods.factorio.com',rel['download_url'])
              dest=P('work/mods')/f'{name}_{ver}.zip';download(url,dest)
              report.append({'name':name,'version':ver,'status':'downloaded','bytes':dest.stat().st_size,'url':url})
            except Exception as exc:
              report.append({'name':name,'version':ver,'status':'failed','error':repr(exc)})
          P('published/mod-downloads.json').write_text(json.dumps(report,indent=2))
          failures=[x for x in report if x['status']=='failed']
          if failures:raise SystemExit(f'{len(failures)} exact mod downloads failed')
          (P('work/mods')/'mod-list.json').write_text(json.dumps({'mods':[{'name':n,'enabled':True} for n in mods]},indent=2))
          PY
          python3 work/setup.py | tee published/setup-console.txt

      - name: Load and inspect progression through RCON
        shell: bash
        run: |
          set -euo pipefail
          cat > work/server-settings.json <<'JSON'
          {"name":"inspection","visibility":{"public":false,"lan":false},"require_user_verification":false,"max_players":0,"autosave_interval":0,"allow_commands":"admins-only"}
          JSON
          work/factorio/bin/x64/factorio \
            --start-server work/candidate.zip \
            --mod-directory work/mods \
            --server-settings work/server-settings.json \
            --rcon-port 27400 --rcon-password inspect \
            > published/server.log 2>&1 &
          PID=$!
          echo "$PID" > work/pid
          for i in $(seq 1 480); do
            grep -q 'Starting RCON interface' published/server.log && break
            kill -0 "$PID" 2>/dev/null || { tail -300 published/server.log; exit 1; }
            sleep 1
          done
          grep -q 'Starting RCON interface' published/server.log

          cat > work/query.py <<'PY'
          import json,pathlib,socket,struct
          def packet(i,t,b):
            p=struct.pack('<ii',i,t)+b.encode()+b'\0\0';return struct.pack('<i',len(p))+p
          def recv(s):
            h=s.recv(4);n=struct.unpack('<i',h)[0];d=b''
            while len(d)<n:d+=s.recv(n-len(d))
            return struct.unpack_from('<ii',d,0)+(d[8:-2].decode('utf-8','replace'),)
          lua=r'''
          local out={tick=game.tick,hours=game.tick/216000,players={},forces={},surfaces={},recipes={},rocket_science_machines=0,rocket_science_working=0,rocket_science_support={}}
          local realforces={}
          for _,f in pairs(game.forces) do if f.name~="enemy" and f.name~="neutral" then realforces[f.name]=true end end
          for _,f in pairs(game.forces) do
            local fr={name=f.name,rockets_launched=f.rockets_launched or 0,rocket_science_output=0,rocket_science_input=0,research={}}
            local ok,v=pcall(function()return f.item_production_statistics.get_output_count("se-rocket-science-pack")end);if ok then fr.rocket_science_output=v end
            local ok2,v2=pcall(function()return f.item_production_statistics.get_input_count("se-rocket-science-pack")end);if ok2 then fr.rocket_science_input=v2 end
            for n,t in pairs(f.technologies) do if t.researched and (string.find(n,"rocket",1,true) or string.find(n,"space",1,true)) then table.insert(fr.research,n) end end
            table.sort(fr.research);table.insert(out.forces,fr)
          end
          for _,p in pairs(game.players) do table.insert(out.players,{name=p.name,force=p.force.name,surface=p.surface and p.surface.name or nil,position=p.position}) end
          for _,s in pairs(game.surfaces) do
            local sr={name=s.name,index=s.index,chunks=0,player_entities=0,entities={},rocket_science_machines=0}
            for _ in s.get_chunks() do sr.chunks=sr.chunks+1 end
            for fn,_ in pairs(realforces) do local ok,c=pcall(function()return s.count_entities_filtered{force=fn}end);if ok then sr.player_entities=sr.player_entities+c end end
            for _,en in pairs({"se-rocket-launch-pad","se-rocket-landing-pad","se-space-science-lab","se-space-assembling-machine","se-space-manufactory","rocket-silo"}) do local ok,c=pcall(function()return s.count_entities_filtered{name=en}end);sr.entities[en]=ok and c or -1 end
            for _,e in pairs(s.find_entities_filtered{type={"assembling-machine","furnace","rocket-silo"}}) do
              local ok,r=pcall(function()return e.get_recipe()end)
              if ok and r then
                out.recipes[r.name]=(out.recipes[r.name] or 0)+1
                if r.name=="se-rocket-science-pack" then
                  out.rocket_science_machines=out.rocket_science_machines+1;sr.rocket_science_machines=sr.rocket_science_machines+1
                  local oks,st=pcall(function()return e.status end);if oks and st==defines.entity_status.working then out.rocket_science_working=out.rocket_science_working+1 end
                end
                if string.find(r.name,"rocket",1,true) or string.find(r.name,"satellite",1,true) then out.rocket_science_support[r.name]=(out.rocket_science_support[r.name] or 0)+1 end
              end
            end
            table.insert(out.surfaces,sr)
          end
          rcon.print(game.table_to_json(out))
          '''
          with socket.create_connection(('127.0.0.1',27400),timeout=20) as s:
            s.settimeout(90);s.sendall(packet(1,3,'inspect'));a=recv(s)
            if a[0]==-1:raise RuntimeError('auth failed')
            s.sendall(packet(2,2,'/sc '+lua));body=recv(s)[2].strip()
          pathlib.Path('published/rcon-raw.txt').write_text(body)
          start=body.find('{');end=body.rfind('}')
          if start<0 or end<start:raise RuntimeError(body[:2000])
          data=json.loads(body[start:end+1]);pathlib.Path('published/progression.json').write_text(json.dumps(data,indent=2,sort_keys=True));print(json.dumps(data,indent=2,sort_keys=True))
          PY
          python3 work/query.py | tee published/progression-console.txt
          kill "$PID" || true
          wait "$PID" || true

      - name: Grade and publish the actual save in safe chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,hashlib,subprocess
          p=json.loads(pathlib.Path('published/progression.json').read_text());forces=p.get('forces',[])
          output=max([f.get('rocket_science_output',0) or 0 for f in forces] or [0]);machines=p.get('rocket_science_machines',0) or 0;working=p.get('rocket_science_working',0) or 0
          orbit=0;other=0;pads=0
          for s in p.get('surfaces',[]):
            pe=s.get('player_entities',0) or 0;low=s.get('name','').lower()
            if 'orbit' in low:orbit+=pe
            if low!='nauvis':other+=pe
            pads+=(s.get('entities') or {}).get('se-rocket-launch-pad',0) or 0
          grade={'rocket_science_output':output,'rocket_science_machines':machines,'rocket_science_working':working,'orbit_player_entities':orbit,'non_nauvis_player_entities':other,'launchpads':pads,'full_scale_cutoff_pass':machines>=2 and output>=1000}
          pathlib.Path('published/grade.json').write_text(json.dumps(grade,indent=2));print(json.dumps(grade,indent=2))
          h=hashlib.sha256()
          with open('work/candidate.zip','rb') as f:
            for c in iter(lambda:f.read(1048576),b''):h.update(c)
          pathlib.Path('published/save-sha256.txt').write_text(h.hexdigest()+'  candidate.zip\n')
          subprocess.run(['split','-b','45M','-d','-a','3','work/candidate.zip','published/chunks/candidate.zip.part'],check=True)
          pathlib.Path('published/chunks/README.txt').write_text('cat candidate.zip.part* > candidate.zip\n')
          PY
      - name: Publish result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$RESULT_BRANCH"
          rm -rf tmp-se-headless-final
          mkdir tmp-se-headless-final
          cp -a published/. tmp-se-headless-final/
          git add -f tmp-se-headless-final
          git commit -m 'Headless-inspect strongest public SE candidate'
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
