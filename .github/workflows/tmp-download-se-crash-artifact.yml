name: Extract lazy_kojocho SE save attachment

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch hidden Note attachment
        shell: bash
        run: python3 scripts/fetch_lazy_note.py
      - name: Upload extracted save and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lazy-kojocho-53h-note-attachment
          path: result/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
