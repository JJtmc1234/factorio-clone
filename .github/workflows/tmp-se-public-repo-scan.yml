name: Temporary public GitHub SE save scan

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  RESULT_BRANCH: "tmp-se-repo-scan-result-20260824"

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Search repositories and inspect real save ZIP headers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work published
          mkdir -p work published/candidates published/previews

          cat > work/scan.py <<'PY'
          from __future__ import annotations
          import io, json, os, re, struct, time, urllib.parse, urllib.request, urllib.error, zipfile
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          api_headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'SE-save-finder/1.0',
          }
          raw_headers = {'User-Agent': 'SE-save-finder/1.0'}

          def api(url: str):
              req = urllib.request.Request(url, headers=api_headers)
              with urllib.request.urlopen(req, timeout=90) as r:
                  return json.load(r)

          queries = [
              'factorio save pushed:>=2025-09-22',
              'factorio saves pushed:>=2025-09-22',
              'factorio-save pushed:>=2025-09-22',
              'factorio_saves pushed:>=2025-09-22',
              'factorio in:name save in:name pushed:>=2025-09-22',
              'factorio backup pushed:>=2025-09-22',
              '"Space Exploration" factorio pushed:>=2025-09-22',
          ]
          repos = {}
          search_errors = []
          for q in queries:
              for page in range(1, 6):
                  url = 'https://api.github.com/search/repositories?' + urllib.parse.urlencode({
                      'q': q, 'per_page': 100, 'page': page, 'sort': 'updated', 'order': 'desc'
                  })
                  try:
                      data = api(url)
                  except Exception as exc:
                      search_errors.append({'query': q, 'page': page, 'error': repr(exc)})
                      break
                  items = data.get('items', [])
                  for item in items:
                      repos[item['full_name']] = {
                          'full_name': item['full_name'],
                          'default_branch': item.get('default_branch') or 'main',
                          'size_kb': item.get('size', 0),
                          'description': item.get('description'),
                          'pushed_at': item.get('pushed_at'),
                          'html_url': item.get('html_url'),
                      }
                  if len(items) < 100:
                      break
                  time.sleep(0.3)

          # Known repos that broad search sometimes omits.
          for full in [
              'NotAFreak/.factorio', 'Sebastian-Schuchmann/factorio-saves',
              'j4yu22/factorio-save', 'luis-navarro1/factorio_saves',
              'Frogo-o/factorio-saves', 'ChristineZhiMei/FACTORIO_SAVES',
              'syedimran23/factorio-multiplayer-saves', 'ianic-dev/factorio-saves',
          ]:
              if full not in repos:
                  try:
                      item = api('https://api.github.com/repos/' + full)
                      repos[full] = {
                          'full_name': full,
                          'default_branch': item.get('default_branch') or 'main',
                          'size_kb': item.get('size', 0),
                          'description': item.get('description'),
                          'pushed_at': item.get('pushed_at'),
                          'html_url': item.get('html_url'),
                      }
                  except Exception as exc:
                      search_errors.append({'repo': full, 'error': repr(exc)})

          class Reader:
              def __init__(self, data: bytes): self.data, self.offset = data, 0
              def u8(self):
                  v = self.data[self.offset]; self.offset += 1; return v
              def u16(self):
                  v = struct.unpack_from('<H', self.data, self.offset)[0]; self.offset += 2; return v
              def u32(self):
                  v = struct.unpack_from('<I', self.data, self.offset)[0]; self.offset += 4; return v
              def version(self): return (self.u16(), self.u16(), self.u16(), self.u16())
              def opt(self, bits, fv):
                  if fv > (0, 14, 14, 0):
                      first = self.u8()
                      if first != 0xff: return first
                  return self.u16() if bits == 16 else self.u32()
              def string(self, fv):
                  n = self.opt(32, fv)
                  raw = self.data[self.offset:self.offset+n]; self.offset += n
                  return raw.decode('utf-8', 'replace')
              def version48(self, fv): return (self.opt(16, fv), self.opt(16, fv), self.opt(16, fv))

          def parse_header(data: bytes):
              r = Reader(data); fv = r.version(); r.u8()
              result = {
                  'factorio_version': '.'.join(map(str, fv)),
                  'save_name': r.string(fv), 'campaign': r.string(fv), 'base_mod': r.string(fv),
              }
              r.u8(); r.u8(); r.u8(); r.string(fv); r.u8(); r.u8(); r.u8(); r.u8()
              result['loaded_from'] = '.'.join(map(str, r.version48(fv)))
              result['loaded_from_build'] = r.u32() if fv[0] >= 2 else r.u16()
              r.u8()
              if fv[0] >= 2: r.offset += 4
              count = r.opt(32, fv)
              mods = {}
              for _ in range(count):
                  name = r.string(fv); ver = '.'.join(map(str, r.version48(fv))); r.u32(); mods[name] = ver
              result['mods'] = mods
              return result

          tree_errors = []
          blobs = []
          for idx, repo in enumerate(repos.values()):
              full = repo['full_name']; branch = repo['default_branch']
              try:
                  branch_data = api(f'https://api.github.com/repos/{full}/branches/{urllib.parse.quote(branch, safe="")}')
                  tree_sha = branch_data['commit']['commit']['tree']['sha']
                  tree = api(f'https://api.github.com/repos/{full}/git/trees/{tree_sha}?recursive=1')
              except Exception as exc:
                  tree_errors.append({'repo': full, 'error': repr(exc)})
                  continue
              for item in tree.get('tree', []):
                  if item.get('type') != 'blob': continue
                  path = item.get('path', '')
                  size = item.get('size') or 0
                  if not path.lower().endswith('.zip'): continue
                  if size < 100_000 or size > 180_000_000: continue
                  score = 0
                  low = (full + '/' + path + ' ' + (repo.get('description') or '')).lower()
                  for word, points in [
                      ('space-exploration', 40), ('space exploration', 40), ('se0.7', 35), ('se07', 35),
                      ('rocket', 20), ('space', 12), ('save', 8), ('autosave', 7), ('factorio', 3),
                  ]:
                      if word in low: score += points
                  # Medium-sized saves are more plausible around the requested checkpoint.
                  mb = size / 1_000_000
                  if 15 <= mb <= 100: score += 8
                  blobs.append({**repo, 'path': path, 'blob_sha': item['sha'], 'bytes': size, 'score': score})
              if idx % 50 == 49: time.sleep(0.5)

          blobs.sort(key=lambda x: (-x['score'], x['bytes']))
          # Bound bandwidth. Prefer promising paths, but still sample generic repositories.
          selected = blobs[:350]
          download_errors = []
          records = []
          total_bytes = 0
          native = []
          for i, item in enumerate(selected):
              if total_bytes > 7_000_000_000: break
              full, branch, path = item['full_name'], item['default_branch'], item['path']
              raw_url = f'https://raw.githubusercontent.com/{full}/{urllib.parse.quote(branch, safe="")}/{urllib.parse.quote(path, safe="/")}'
              try:
                  req = urllib.request.Request(raw_url, headers=raw_headers)
                  with urllib.request.urlopen(req, timeout=240) as r:
                      data = r.read(180_000_001)
                  if len(data) > 180_000_000:
                      raise RuntimeError('download exceeded limit')
                  total_bytes += len(data)
                  if data.startswith(b'version https://git-lfs.github.com/spec'):
                      raise RuntimeError('Git LFS pointer, not save bytes')
                  with zipfile.ZipFile(io.BytesIO(data)) as zf:
                      names = zf.namelist()
                      init = next((n for n in names if n.endswith('/level-init.dat') or n == 'level-init.dat'), None)
                      level = next((n for n in names if n.endswith('/level.dat') or n == 'level.dat'), None)
                      if not init or not level:
                          raise RuntimeError('not a Factorio save ZIP')
                      header = parse_header(zf.read(init))
                      mods = header['mods']
                      script_name = next((n for n in names if n.endswith('/script.dat') or n == 'script.dat'), None)
                      marker_counts = {}
                      if script_name:
                          script = zf.read(script_name)
                          for label, marker in {
                              'rocket_science': b'se-rocket-science-pack',
                              'launch_pad': b'se-rocket-launch-pad',
                              'cargo_section': b'se-cargo-rocket-section',
                              'nauvis_orbit': b'Nauvis Orbit',
                              'space_lab': b'se-space-science-lab',
                              'space_scaffold': b'se-space-platform-scaffold',
                          }.items(): marker_counts[label] = script.count(marker)
                      rec = {
                          **item, 'raw_url': raw_url, 'downloaded_bytes': len(data),
                          'factorio_save': True, 'header': header, 'marker_counts': marker_counts,
                          'se_version': mods.get('space-exploration'),
                          'k2_version': mods.get('Krastorio2'),
                      }
                      records.append(rec)
                      if str(rec['se_version']).startswith('0.7.'):
                          native.append(rec)
                          safe = re.sub(r'[^A-Za-z0-9._-]+', '_', f'{full}__{path}')[-180:]
                          # Keep actual bytes only when GitHub can store them.
                          if len(data) < 95_000_000:
                              Path('published/candidates', safe).write_bytes(data)
                              rec['published_copy'] = 'candidates/' + safe
                          preview_name = next((n for n in names if n.endswith('/preview.jpg') or n == 'preview.jpg'), None)
                          if preview_name:
                              Path('published/previews', safe + '.jpg').write_bytes(zf.read(preview_name))
                              rec['published_preview'] = 'previews/' + safe + '.jpg'
              except Exception as exc:
                  download_errors.append({**item, 'raw_url': raw_url, 'error': repr(exc)})
              if i % 20 == 19: time.sleep(0.5)

          # Re-write after published_copy / preview additions.
          Path('published/native-se07-candidates.json').write_text(json.dumps(native, indent=2))
          Path('published/all-valid-factorio-saves.json').write_text(json.dumps(records, indent=2))
          Path('published/repositories.json').write_text(json.dumps(list(repos.values()), indent=2))
          Path('published/all-zip-blobs.json').write_text(json.dumps(blobs, indent=2))
          Path('published/errors.json').write_text(json.dumps({
              'search': search_errors, 'tree': tree_errors, 'download': download_errors
          }, indent=2))
          summary = {
              'repositories': len(repos), 'zip_blobs': len(blobs), 'selected_for_download': len(selected),
              'downloaded_bytes': total_bytes, 'valid_factorio_saves': len(records),
              'native_se07_saves': len(native),
          }
          Path('published/summary.json').write_text(json.dumps(summary, indent=2))
          Path('published/summary.txt').write_text('\n'.join(f'{k}: {v}' for k,v in summary.items()))
          print(json.dumps(summary, indent=2))
          PY

          python3 work/scan.py | tee published/console.txt

      - name: Publish scan results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$RESULT_BRANCH"
          rm -rf tmp-se-repo-scan
          mkdir -p tmp-se-repo-scan
          cp -a published/. tmp-se-repo-scan/
          git add -f tmp-se-repo-scan
          git commit -m 'Scan public GitHub saves for native SE 0.7 candidates'
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
