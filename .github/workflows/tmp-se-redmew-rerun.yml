name: Rerun RedMew SE inspection

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  RESULT_BRANCH: tmp-se-redmew-rerun-result-20260824
  SAVE_URL: "https://refactorio.de/saves?directory=public%2Ffinal&file=se_crash.zip"

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download save, exact Factorio, and exact mods
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work published
          mkdir -p work/mods published
          curl -fL --retry 8 --retry-all-errors --max-time 1800 -o work/candidate.zip "$SAVE_URL"
          unzip -t work/candidate.zip > published/unzip-test.txt
          sha256sum work/candidate.zip > published/save-sha256.txt

          cat > work/setup.py <<'PY'
          import json, pathlib, random, tarfile, urllib.parse, urllib.request, zipfile
          P=pathlib.Path
          mods={
            'RateCalculator':'3.3.7','aai-containers':'0.3.1','aai-industry':'0.6.11','aai-loaders':'0.2.7',
            'aai-signal-transmission':'0.5.1','alien-biomes':'0.7.4','alien-biomes-graphics':'0.7.1',
            'bullet-trails':'0.7.1','combat-mechanics-overhaul':'0.7.2','equipment-gantry':'0.2.3',
            'factoryplanner':'2.0.35','flib':'0.16.3','grappling-gun':'0.4.1','informatron':'0.4.0',
            'jetpack':'0.4.12','logistic-helper':'2.1.0','robot_attrition':'0.6.3','shield-projector':'0.2.2',
            'space-exploration':'0.7.27','space-exploration-graphics':'0.7.5',
            'space-exploration-graphics-2':'0.7.2','space-exploration-graphics-3':'0.7.2',
            'space-exploration-graphics-4':'0.7.2','space-exploration-graphics-5':'0.7.2',
            'space-exploration-menu-simulations':'0.7.4','space-exploration-postprocess':'0.7.3','textplates':'0.7.2'
          }
          def download(url,dst,timeout=1200):
            req=urllib.request.Request(url,headers={'User-Agent':'FactorioModDownloader/0.5.0'})
            with urllib.request.urlopen(req,timeout=timeout) as r,open(dst,'wb') as f:
              while True:
                b=r.read(1024*1024)
                if not b:break
                f.write(b)
          download('https://factorio.com/get-download/2.0.66/headless/linux64','work/factorio.tar.xz')
          with tarfile.open('work/factorio.tar.xz','r:xz') as a:a.extractall('work')
          report=[]
          for name,version in mods.items():
            dst=P('work/mods')/f'{name}_{version}.zip'; qn=urllib.parse.quote(name,safe=''); qv=urllib.parse.quote(version,safe='')
            urls=[f'https://mods-storage.re146.dev/{qn}/{qv}.zip?anticache={random.random()}',f'https://dl-mod.factorio.com/{qn}/{qv}.zip']
            error=None
            for url in urls:
              try:
                download(url,dst)
                with zipfile.ZipFile(dst) as z:
                  if not z.namelist():raise RuntimeError('empty zip')
                report.append({'name':name,'version':version,'bytes':dst.stat().st_size,'status':'ok'});error=None;break
              except Exception as exc:
                error=repr(exc);dst.unlink(missing_ok=True)
            if error:report.append({'name':name,'version':version,'status':'failed','error':error})
          P('published/mod-downloads.json').write_text(json.dumps(report,indent=2))
          failures=[x for x in report if x['status']=='failed']
          enabled=[{'name':'base','enabled':True}]+[{'name':n,'enabled':True} for n in mods]
          enabled += [{'name':'space-age','enabled':False},{'name':'quality','enabled':False},{'name':'elevated-rails','enabled':False}]
          P('work/mods/mod-list.json').write_text(json.dumps({'mods':enabled},indent=2))
          if failures:raise SystemExit(f'{len(failures)} mod downloads failed')
          PY
          python3 work/setup.py

      - name: Start server and query exact progression
        shell: bash
        run: |
          set -euo pipefail
          cat > work/server-settings.json <<'JSON'
          {"name":"inspection","description":"inspection","visibility":{"public":false,"lan":false},"require_user_verification":false,"max_players":0,"autosave_interval":0,"allow_commands":"admins-only"}
          JSON
          work/factorio/bin/x64/factorio --start-server work/candidate.zip --mod-directory work/mods \
            --server-settings work/server-settings.json --rcon-port 27501 --rcon-password inspect \
            > published/server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 1200); do
            grep -q 'Starting RCON interface' published/server.log && break
            kill -0 $PID 2>/dev/null || { tail -500 published/server.log; exit 1; }
            sleep 1
          done
          grep -q 'Starting RCON interface' published/server.log

          cat > work/query.py <<'PY'
          import json,pathlib,socket,struct
          def packet(i,t,b):
            p=struct.pack('<ii',i,t)+b.encode()+b'\0\0';return struct.pack('<i',len(p))+p
          def receive(s):
            h=s.recv(4)
            if len(h)!=4:raise RuntimeError('short header')
            n=struct.unpack('<i',h)[0];d=b''
            while len(d)<n:
              c=s.recv(n-len(d))
              if not c:raise RuntimeError('closed')
              d+=c
            return struct.unpack_from('<ii',d,0)+(d[8:-2].decode('utf-8','replace'),)
          lua=r'''
          local r={tick=game.tick,hours=game.tick/216000,forces={},players={},surfaces={},rocket_science_machines=0,rocket_science_working=0,support={}}
          local player_forces={}
          for _,f in pairs(game.forces) do
            if f.name~="enemy" and f.name~="neutral" then player_forces[f.name]=true end
            local row={name=f.name,rockets_launched=f.rockets_launched or 0,rocket_science_output=0,rocket_science_input=0}
            local ok,v=pcall(function()return f.item_production_statistics.get_output_count("se-rocket-science-pack")end);if ok then row.rocket_science_output=v end
            ok,v=pcall(function()return f.item_production_statistics.get_input_count("se-rocket-science-pack")end);if ok then row.rocket_science_input=v end
            table.insert(r.forces,row)
          end
          for _,p in pairs(game.players) do table.insert(r.players,{name=p.name,force=p.force.name,surface=p.surface.name}) end
          for _,s in pairs(game.surfaces) do
            local row={name=s.name,index=s.index,player_entities=0,chunks=0,entities={}}
            for _ in s.get_chunks() do row.chunks=row.chunks+1 end
            for fn,_ in pairs(player_forces) do local ok,v=pcall(function()return s.count_entities_filtered{force=fn}end);if ok then row.player_entities=row.player_entities+v end end
            for _,n in pairs({"se-rocket-launch-pad","se-rocket-landing-pad","se-space-science-lab","se-space-assembling-machine","se-space-manufactory","rocket-silo"}) do
              local ok,v=pcall(function()return s.count_entities_filtered{name=n}end);row.entities[n]=ok and v or -1
            end
            for _,e in pairs(s.find_entities_filtered{type={"assembling-machine","furnace","rocket-silo"}}) do
              local ok,recipe=pcall(function()return e.get_recipe()end)
              if ok and recipe then
                if recipe.name=="se-rocket-science-pack" then
                  r.rocket_science_machines=r.rocket_science_machines+1
                  local a,status=pcall(function()return e.status end)
                  if a and status==defines.entity_status.working then r.rocket_science_working=r.rocket_science_working+1 end
                end
                if recipe.name=="se-cargo-rocket-section" or recipe.name=="se-rocket-science-pack" or string.find(recipe.name,"satellite",1,true) or string.find(recipe.name,"rocket-fuel",1,true) then
                  r.support[recipe.name]=(r.support[recipe.name] or 0)+1
                end
              end
            end
            table.insert(r.surfaces,row)
          end
          rcon.print(game.table_to_json(r))
          '''
          with socket.create_connection(('127.0.0.1',27501),timeout=30) as s:
            s.settimeout(180);s.sendall(packet(1,3,'inspect'));a=receive(s)
            if a[0]==-1:raise RuntimeError('auth')
            s.sendall(packet(2,2,'/sc '+lua));body=receive(s)[2].strip()
          pathlib.Path('published/rcon-raw.txt').write_text(body)
          i,j=body.find('{'),body.rfind('}')
          if i<0 or j<i:raise RuntimeError(body[:2000])
          p=json.loads(body[i:j+1]);pathlib.Path('published/progression.json').write_text(json.dumps(p,indent=2,sort_keys=True))
          forces=p.get('forces',[]);output=max([x.get('rocket_science_output',0) or 0 for x in forces] or [0])
          orbit=0;other=0;pads=0
          for surf in p.get('surfaces',[]):
            n=surf.get('player_entities',0) or 0;low=surf.get('name','').lower()
            if 'orbit' in low:orbit+=n
            if low!='nauvis':other+=n
            pads+=(surf.get('entities') or {}).get('se-rocket-launch-pad',0) or 0
          grade={'inspection_complete':True,'hours':p.get('hours'),'rocket_science_output':output,
            'rocket_science_machines':p.get('rocket_science_machines',0),'rocket_science_working':p.get('rocket_science_working',0),
            'support':p.get('support',{}),'orbit_player_entities':orbit,'non_nauvis_player_entities':other,'launchpads':pads}
          grade['full_scale_cutoff_pass']=grade['rocket_science_machines']>=2 and output>=1000
          grade['orbit_close_enough']=orbit<100
          pathlib.Path('published/grade.json').write_text(json.dumps(grade,indent=2,sort_keys=True))
          print(json.dumps(grade,indent=2,sort_keys=True))
          PY
          python3 work/query.py | tee published/console.txt

      - name: Publish result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$RESULT_BRANCH"
          rm -rf tmp-se-redmew-rerun
          mkdir -p tmp-se-redmew-rerun
          cp -a published/. tmp-se-redmew-rerun/
          git add -f tmp-se-redmew-rerun
          git commit -m 'Rerun RedMew SE progression inspection'
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
