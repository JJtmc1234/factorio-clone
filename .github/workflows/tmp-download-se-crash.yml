name: Audit stubborn native SE 0.7 saves

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    name: audit-${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: rk-se-2
            url: https://forums.factorio.com/download/file.php?id=109074
          - id: spaceexploration-108368
            url: https://forums.factorio.com/download/file.php?id=108368
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-se07-salvage-minimal-v2-20260826
      - name: Audit candidate
        shell: bash
        run: bash scripts/stubborn-se07-audit.sh '${{ matrix.id }}' '${{ matrix.url }}'
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stubborn-se07-${{ matrix.id }}
          path: |
            reports/
            attempts/
            match/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
