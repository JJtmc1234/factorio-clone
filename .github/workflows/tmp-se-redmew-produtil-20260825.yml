name: Audit RedMew SE production and utility science

on:
  push:
    branches: [tmp-se-redmew-produtil-20260825]

permissions:
  contents: write

env:
  RESULT_BRANCH: tmp-se-redmew-produtil-result-20260825
  SAVE_URL: "https://refactorio.de/saves?directory=public%2Ffinal&file=2025_10_Space_Exploration_v07.zip"
  SOURCE_WORKFLOW: "https://raw.githubusercontent.com/JJtmc1234/factorio-clone/tmp-se-redmew-science-window-20260825/.github/workflows/tmp-se-redmew-science-window-20260825.yml"

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Download save and prepare exact runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work published
          mkdir -p work/mods published
          curl -fL --retry 10 --retry-all-errors --max-time 3600 -o work/candidate.zip "$SAVE_URL"
          unzip -t work/candidate.zip > published/unzip-test.txt
          sha256sum work/candidate.zip > published/save-sha256.txt
          cp work/candidate.zip published/RedMew-SE07-produtil-candidate.zip
          curl -fsSL "$SOURCE_WORKFLOW" -o work/source-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          text=Path('work/source-workflow.yml').read_text()
          def extract(target):
              marker=f"cat > work/{target} <<'PY'\n"
              start=text.index(marker)+len(marker)
              end=text.index("\n          PY",start)
              return textwrap.dedent(text[start:end]).lstrip()
          Path('work/setup.py').write_text(extract('setup.py'))
          Path('work/query.py').write_text(extract('query.py'))
          PY
          python3 work/setup.py | tee published/setup-console.txt

      - name: Load and audit save
        shell: bash
        run: |
          set -euo pipefail
          cat > work/server-settings.json <<'JSON'
          {"name":"inspection","description":"inspection","visibility":{"public":false,"lan":false},"require_user_verification":false,"max_players":0,"autosave_interval":0,"allow_commands":"admins-only"}
          JSON
          work/factorio/bin/x64/factorio --start-server work/candidate.zip --mod-directory work/mods \
            --server-settings work/server-settings.json --rcon-port 27521 --rcon-password inspect \
            > published/server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 1800); do
            grep -q 'Starting RCON interface' published/server.log && break
            kill -0 "$PID" 2>/dev/null || { tail -600 published/server.log; exit 1; }
            sleep 1
          done
          grep -q 'Starting RCON interface' published/server.log
          python3 work/query.py | tee published/console.txt

      - name: Add production and utility verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('published/grade.json').read_text())
          prod=g.get('production_science_output',0) or 0
          util=g.get('utility_science_output',0) or 0
          spec_out=g.get('specialist_science_output',0) or 0
          spec_in=g.get('specialist_science_input',0) or 0
          spec_m=g.get('specialist_science_machines',0) or 0
          researched=len(g.get('researched_technologies_using_specialist_science',[]))
          match=prod>0 and util>0 and spec_out==0 and spec_in==0 and spec_m==0
          strict=match and researched==0
          g['prod_util_target_match']=match
          g['prod_util_strict_match']=strict
          Path('published/grade.json').write_text(json.dumps(g,indent=2,sort_keys=True))
          lines=['# RedMew production + utility science audit','',f"## Verdict: {'MATCH' if match else 'NOT A MATCH'}",'',
            f"- Production Science output: **{prod}**",f"- Utility Science output: **{util}**",
            f"- Specialist Science output: **{spec_out}**",f"- Specialist Science consumed: **{spec_in}**",
            f"- Specialist Science machines: **{spec_m}**",f"- Specialist-science technologies researched: **{researched}**",
            f"- Practical match: **{match}**",f"- Strict match: **{strict}**"]
          Path('published/PRODUTIL_VERDICT.md').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Upload actual save and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redmew-se07-produtil-audit
          path: published/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Publish small result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f published/RedMew-SE07-produtil-candidate.zip
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$RESULT_BRANCH"
          rm -rf tmp-se-redmew-produtil
          mkdir -p tmp-se-redmew-produtil
          cp -a published/. tmp-se-redmew-produtil/
          git add -f tmp-se-redmew-produtil
          git commit -m 'Publish RedMew production and utility audit' || true
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
