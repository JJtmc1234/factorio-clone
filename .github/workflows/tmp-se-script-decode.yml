name: Temporary SE script-state decode

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  RESULT_BRANCH: tmp-se-script-decode-result-20260824

jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download saves and decode script.dat
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work published
          mkdir -p work published
          python3 -m pip install --quiet --upgrade gdown hornwitser.factorio_tools
          cat > work/decode.py <<'PY'
          import json,pathlib,subprocess,zipfile,re,os
          P=pathlib.Path
          candidates=[
            ('1nScbABVE1hugI9Oj5Li6XRotivrJuBsp','migration_workaround_0754'),
            ('1Tin_CrL075mHPVhDVdZtFErzZb86Hxbo','miniloader_migration_06146'),
          ]
          for fileid,name in candidates:
            out=P('published')/name;out.mkdir(parents=True,exist_ok=True)
            save=P('work')/(name+'.zip')
            rec={'name':name}
            try:
              p=subprocess.run(['gdown','--no-cookies','-O',str(save),fileid],text=True,capture_output=True,timeout=1200)
              if p.returncode:raise RuntimeError('gdown failed: '+p.stderr[-2000:])
              with zipfile.ZipFile(save) as z:
                script=next(n for n in z.namelist() if n.endswith('/script.dat') or n=='script.dat')
                script_path=P('work')/(name+'.script.dat');script_path.write_bytes(z.read(script))
              json_path=P('work')/(name+'.script.json')
              proc=subprocess.run(['python3','-m','hornwitser.factorio_tools','dat2json','-i',str(script_path),'-o',str(json_path)],text=True,capture_output=True,timeout=1800)
              rec['decoder_stdout']=proc.stdout[-4000:];rec['decoder_stderr']=proc.stderr[-4000:];rec['decoder_returncode']=proc.returncode
              if proc.returncode or not json_path.exists():raise RuntimeError('decoder failed')
              rec['script_dat_bytes']=script_path.stat().st_size;rec['json_bytes']=json_path.stat().st_size
              data=json.loads(json_path.read_text())
              rec['top_type']=type(data).__name__;rec['top_keys']=list(data)[:200] if isinstance(data,dict) else None;rec['top_length']=len(data) if hasattr(data,'__len__') else None

              terms=('rocket','science','launch','landing','orbit','zone','surface','visit','milestone','satellite','space')
              hits=[]
              def scalar(v):return isinstance(v,(str,int,float,bool)) or v is None
              def walk(v,path,depth=0):
                if len(hits)>=20000 or depth>30:return
                if isinstance(v,dict):
                  for k,x in v.items():
                    p2=path+[str(k)];low=str(k).lower()
                    if any(t in low for t in terms):
                      hit={'path':'/'.join(p2),'type':type(x).__name__}
                      if scalar(x):hit['value']=x
                      elif hasattr(x,'__len__'):hit['length']=len(x)
                      hits.append(hit)
                    walk(x,p2,depth+1)
                elif isinstance(v,list):
                  for i,x in enumerate(v):walk(x,path+[str(i)],depth+1)
                elif isinstance(v,str) and any(t in v.lower() for t in terms):
                  hits.append({'path':'/'.join(path),'type':'str','value':v[:1000]})
              walk(data,[])
              rec['keyword_hits']=len(hits)
              (out/'keyword-hits.json').write_text(json.dumps(hits,indent=2))

              # Locate and retain likely mod roots with bounded summaries.
              roots=[]
              def roots_walk(v,path,depth=0):
                if depth>8:return
                if isinstance(v,dict):
                  for k,x in v.items():
                    low=str(k).lower();p2=path+[str(k)]
                    if 'space-exploration' in low or low in ('milestones','space_exploration'):
                      roots.append({'path':'/'.join(p2),'type':type(x).__name__,'length':len(x) if hasattr(x,'__len__') else None})
                    roots_walk(x,p2,depth+1)
                elif isinstance(v,list):
                  for i,x in enumerate(v[:1000]):roots_walk(x,path+[str(i)],depth+1)
              roots_walk(data,[]);rec['candidate_roots']=roots
              (out/'summary.json').write_text(json.dumps(rec,indent=2))
            except Exception as e:
              rec['error']=repr(e);(out/'summary.json').write_text(json.dumps(rec,indent=2))
          PY
          python3 work/decode.py | tee published/console.txt
      - name: Publish decoded summaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$RESULT_BRANCH"
          rm -rf tmp-se-script-decode
          mkdir tmp-se-script-decode
          cp -a published/. tmp-se-script-decode/
          git add -f tmp-se-script-decode
          git commit -m 'Decode public SE save script state'
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
