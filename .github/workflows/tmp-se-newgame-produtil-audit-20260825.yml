name: Audit New Game SE production and utility stage

on:
  push:
    branches: [tmp-se-newgame-produtil-audit-20260825]

permissions:
  contents: write

env:
  RESULT_BRANCH: tmp-se-newgame-produtil-audit-result-20260825
  SAVE_URL: https://github.com/user-attachments/files/21559231/New.Game.zip

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Download save, Factorio, and usable exact mods
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work published
          mkdir -p work/mods published
          curl -fL --retry 10 --retry-all-errors --max-time 1800 -o work/candidate.zip "$SAVE_URL"
          unzip -t work/candidate.zip > published/unzip-test.txt
          sha256sum work/candidate.zip > published/save-sha256.txt
          cp work/candidate.zip published/New.Game.original.zip

          cat > work/setup.py <<'PY'
          import json, pathlib, struct, urllib.request, urllib.parse, urllib.error, tarfile, shutil
          P=pathlib.Path
          with __import__('zipfile').ZipFile('work/candidate.zip') as z:
              init=next(n for n in z.namelist() if n.endswith('/level-init.dat') or n=='level-init.dat')
              d=z.read(init)
          class R:
              def __init__(self,d): self.d=d; self.o=0
              def u8(self): v=self.d[self.o]; self.o+=1; return v
              def u16(self): v=struct.unpack_from('<H',self.d,self.o)[0]; self.o+=2; return v
              def u32(self): v=struct.unpack_from('<I',self.d,self.o)[0]; self.o+=4; return v
              def ver(self): return self.u16(),self.u16(),self.u16(),self.u16()
              def opt(self,b,fv):
                  if fv>(0,14,14,0):
                      x=self.u8()
                      if x!=255: return x
                  return self.u16() if b==16 else self.u32()
              def text(self,fv):
                  n=self.opt(32,fv); v=self.d[self.o:self.o+n]; self.o+=n; return v.decode('utf-8','replace')
              def v48(self,fv): return self.opt(16,fv),self.opt(16,fv),self.opt(16,fv)
          r=R(d); fv=r.ver(); r.u8(); save_name=r.text(fv); campaign=r.text(fv); base_mod=r.text(fv)
          r.u8();r.u8();r.u8();r.text(fv);r.u8();r.u8();r.u8();r.u8()
          loaded='.'.join(map(str,r.v48(fv))); build=r.u32() if fv[0]>=2 else r.u16(); r.u8()
          if fv[0]>=2: r.o += 4
          mods={}
          for _ in range(r.opt(32,fv)):
              name=r.text(fv); ver='.'.join(map(str,r.v48(fv))); r.u32(); mods[name]=ver
          version='.'.join(map(str,fv[:3]))
          header={'factorio_version':version,'factorio_version_full':'.'.join(map(str,fv)),'save_name':save_name,'campaign':campaign,'base_mod':base_mod,'loaded_from':loaded,'loaded_from_build':build,'mods':mods}
          P('published/header.json').write_text(json.dumps(header,indent=2,sort_keys=True))

          def download(url,dest,timeout=900):
              req=urllib.request.Request(url,headers={'User-Agent':'JJ-SE-produtil-auditor/1.0'})
              with urllib.request.urlopen(req,timeout=timeout) as src,dest.open('wb') as out:
                  while True:
                      chunk=src.read(1024*1024)
                      if not chunk: break
                      out.write(chunk)

          archive=P('work/factorio.tar.xz')
          download(f'https://factorio.com/get-download/{version}/headless/linux64',archive)
          with tarfile.open(archive,'r:xz') as t: t.extractall('work')

          builtin={'base','core'}
          report=[]
          enabled=[]
          for name,ver in mods.items():
              if name in builtin:
                  report.append({'name':name,'version':ver,'status':'builtin'})
                  if name=='base': enabled.append(name)
                  continue
              try:
                  api='https://mods.factorio.com/api/mods/'+urllib.parse.quote(name,safe='')+'/full'
                  with urllib.request.urlopen(urllib.request.Request(api,headers={'User-Agent':'JJ-SE-produtil-auditor/1.0'}),timeout=90) as response:
                      meta=json.load(response)
                  rel=next((x for x in meta.get('releases',[]) if x.get('version')==ver),None)
                  if not rel: raise RuntimeError('exact release missing')
                  url=urllib.parse.urljoin('https://mods.factorio.com',rel['download_url'])
                  dest=P('work/mods')/f'{name}_{ver}.zip'
                  download(url,dest)
                  report.append({'name':name,'version':ver,'status':'downloaded','bytes':dest.stat().st_size,'url':url})
                  enabled.append(name)
              except Exception as exc:
                  report.append({'name':name,'version':ver,'status':'failed-disabled','error':repr(exc)})
          P('published/mod-downloads.json').write_text(json.dumps(report,indent=2,sort_keys=True))
          P('work/mods/mod-list.json').write_text(json.dumps({'mods':[{'name':n,'enabled':True} for n in enabled]},indent=2))
          essential={'space-exploration','space-exploration-postprocess','aai-industry','alien-biomes'}
          missing=sorted(n for n in essential if n in mods and n not in enabled)
          P('published/missing-essential.json').write_text(json.dumps(missing,indent=2))
          if missing: raise SystemExit('Missing essential mods: '+', '.join(missing))
          print(json.dumps({'header':header,'downloaded_mods':len(enabled),'failed_mods':[x for x in report if x['status'].startswith('failed')]},indent=2))
          PY
          python3 work/setup.py | tee published/setup-console.txt

      - name: Load save and query exact science state
        shell: bash
        run: |
          set -euo pipefail
          cat > work/server-settings.json <<'JSON'
          {"name":"inspection","description":"inspection","visibility":{"public":false,"lan":false},"require_user_verification":false,"max_players":0,"autosave_interval":0,"allow_commands":"admins-only"}
          JSON
          work/factorio/bin/x64/factorio --start-server work/candidate.zip --mod-directory work/mods \
            --server-settings work/server-settings.json --rcon-port 27531 --rcon-password inspect \
            > published/server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 1200); do
              grep -q 'Starting RCON interface' published/server.log && break
              kill -0 "$PID" 2>/dev/null || { tail -600 published/server.log; exit 1; }
              sleep 1
          done
          grep -q 'Starting RCON interface' published/server.log

          cat > work/query.py <<'PY'
          import json, pathlib, socket, struct
          def packet(i,t,b):
              p=struct.pack('<ii',i,t)+b.encode()+b'\0\0'; return struct.pack('<i',len(p))+p
          def recv(s):
              h=s.recv(4)
              if len(h)!=4: raise RuntimeError('short RCON header')
              n=struct.unpack('<i',h)[0]; d=b''
              while len(d)<n: d+=s.recv(n-len(d))
              return struct.unpack_from('<ii',d,0)+(d[8:-2].decode('utf-8','replace'),)
          lua=r'''
          local out={tick=game.tick,hours=game.tick/216000,forces={},players={},surfaces={},science_stats={},science_recipes={},researched_specialist={}}
          local patterns={"science%-pack","catalogue","insight","significant%-data"}
          local specialist_terms={"astronomic","biological","energy%-science","material%-science","deep%-space"}
          local function is_science_name(n)
            for _,p in pairs(patterns) do if string.find(n,p) then return true end end
            return false
          end
          local function is_specialist(n)
            for _,p in pairs(specialist_terms) do if string.find(n,p) then return true end end
            return false
          end
          for _,f in pairs(game.forces) do
            local fr={name=f.name,rockets_launched=f.rockets_launched or 0,items={},researched_specialist={}}
            for n,_ in pairs(game.item_prototypes) do
              if is_science_name(n) then
                local o=0;local i=0
                pcall(function() o=f.item_production_statistics.get_output_count(n) end)
                pcall(function() i=f.item_production_statistics.get_input_count(n) end)
                if o>0 or i>0 then fr.items[n]={output=o,input=i} end
              end
            end
            for n,t in pairs(f.technologies) do
              if t.researched and is_specialist(n) then table.insert(fr.researched_specialist,n) end
            end
            table.sort(fr.researched_specialist)
            table.insert(out.forces,fr)
          end
          for _,p in pairs(game.players) do table.insert(out.players,{name=p.name,force=p.force.name,surface=p.surface and p.surface.name or nil,position=p.position}) end
          for _,s in pairs(game.surfaces) do
            local sr={name=s.name,index=s.index,chunks=0,player_entities=0,science_recipes={}}
            for _ in s.get_chunks() do sr.chunks=sr.chunks+1 end
            for _,f in pairs(game.forces) do
              if f.name~="enemy" and f.name~="neutral" then
                local ok,c=pcall(function() return s.count_entities_filtered{force=f} end)
                if ok then sr.player_entities=sr.player_entities+c end
              end
            end
            local ok,entities=pcall(function() return s.find_entities_filtered{type={"assembling-machine","furnace","rocket-silo","lab"}} end)
            if ok then
              for _,e in pairs(entities) do
                local okr,r=pcall(function() return e.get_recipe() end)
                if okr and r and is_science_name(r.name) then
                  sr.science_recipes[r.name]=(sr.science_recipes[r.name] or 0)+1
                  out.science_recipes[r.name]=(out.science_recipes[r.name] or 0)+1
                end
              end
            end
            table.insert(out.surfaces,sr)
          end
          rcon.print(game.table_to_json(out))
          '''
          with socket.create_connection(('127.0.0.1',27531),timeout=30) as s:
              s.settimeout(180)
              s.sendall(packet(1,3,'inspect')); auth=recv(s)
              if auth[0]==-1: raise RuntimeError('RCON auth failed')
              s.sendall(packet(2,2,'/sc '+lua)); body=recv(s)[2].strip()
          pathlib.Path('published/rcon-raw.txt').write_text(body)
          start=body.find('{'); end=body.rfind('}')
          if start<0 or end<start: raise RuntimeError(body[:4000])
          data=json.loads(body[start:end+1])
          pathlib.Path('published/progression.json').write_text(json.dumps(data,indent=2,sort_keys=True))
          print(json.dumps(data,indent=2,sort_keys=True))
          PY
          python3 work/query.py | tee published/progression-console.txt

      - name: Grade target stage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('published/progression.json').read_text())
          items={}; researched=[]
          for f in d.get('forces',[]):
              for n,v in (f.get('items') or {}).items():
                  cur=items.setdefault(n,{'output':0,'input':0})
                  cur['output']+=v.get('output',0) or 0;cur['input']+=v.get('input',0) or 0
              researched += f.get('researched_specialist') or []
          recipes=d.get('science_recipes') or {}
          def stat(names):
              return sum(items.get(n,{}).get('output',0) or 0 for n in names),sum(items.get(n,{}).get('input',0) or 0 for n in names),sum(recipes.get(n,0) or 0 for n in names)
          prod_names=[n for n in set(items)|set(recipes) if n in ('production-science-pack','se-production-science-pack')]
          util_names=[n for n in set(items)|set(recipes) if n in ('utility-science-pack','se-utility-science-pack')]
          rocket_names=[n for n in set(items)|set(recipes) if n=='se-rocket-science-pack']
          space_names=[n for n in set(items)|set(recipes) if n in ('space-science-pack','se-space-science-pack')]
          spec_names=[n for n in set(items)|set(recipes) if any(x in n for x in ('astronomic-science-pack','biological-science-pack','energy-science-pack','material-science-pack','deep-space-science-pack'))]
          prod=stat(prod_names);util=stat(util_names);rocket=stat(rocket_names);space=stat(space_names);spec=stat(spec_names)
          orbital_entities=sum((s.get('player_entities',0) or 0) for s in d.get('surfaces',[]) if s.get('name','').lower()!='nauvis')
          grade={
              'hours':d.get('hours'),'rockets_launched':max([f.get('rockets_launched',0) or 0 for f in d.get('forces',[])] or [0]),
              'production_names':prod_names,'production_output':prod[0],'production_input':prod[1],'production_machines':prod[2],
              'utility_names':util_names,'utility_output':util[0],'utility_input':util[1],'utility_machines':util[2],
              'rocket_science_output':rocket[0],'rocket_science_input':rocket[1],'rocket_science_machines':rocket[2],
              'space_science_output':space[0],'space_science_input':space[1],'space_science_machines':space[2],
              'specialist_names':spec_names,'specialist_output':spec[0],'specialist_input':spec[1],'specialist_machines':spec[2],
              'researched_specialist':sorted(set(researched)),'non_nauvis_player_entities':orbital_entities,
          }
          grade['prod_present']=prod[0]>0 or prod[1]>0 or prod[2]>0
          grade['util_present']=util[0]>0 or util[1]>0 or util[2]>0
          grade['specialist_absent']=spec[0]==0 and spec[1]==0 and spec[2]==0
          grade['target_match']=grade['prod_present'] and grade['util_present'] and grade['specialist_absent']
          Path('published/grade.json').write_text(json.dumps(grade,indent=2,sort_keys=True))
          lines=['# New Game production + utility audit','',f"## Verdict: {'MATCH' if grade['target_match'] else 'NOT A MATCH'}",'',
              f"- Hours: **{grade['hours']}**",f"- Rockets launched: **{grade['rockets_launched']}**",
              f"- Production Science: output **{prod[0]}**, consumed **{prod[1]}**, machines **{prod[2]}**",
              f"- Utility Science: output **{util[0]}**, consumed **{util[1]}**, machines **{util[2]}**",
              f"- Rocket Science: output **{rocket[0]}**, consumed **{rocket[1]}**, machines **{rocket[2]}**",
              f"- Space Science: output **{space[0]}**, consumed **{space[1]}**, machines **{space[2]}**",
              f"- Specialist Science: output **{spec[0]}**, consumed **{spec[1]}**, machines **{spec[2]}**",
              f"- Researched specialist technologies: **{len(grade['researched_specialist'])}**",
              f"- Non-Nauvis player entities: **{orbital_entities}**"]
          Path('published/VERDICT.md').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Upload actual save and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newgame-se-produtil-audit
          path: published/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Publish small result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f published/New.Game.original.zip
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$RESULT_BRANCH"
          rm -rf tmp-se-newgame-produtil-audit
          mkdir -p tmp-se-newgame-produtil-audit
          cp -a published/. tmp-se-newgame-produtil-audit/
          git add -f tmp-se-newgame-produtil-audit
          git commit -m 'Publish New Game prod-util audit' || true
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
