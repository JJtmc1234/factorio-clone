name: Identify public SE save candidates v2

on:
  push:
    branches: [tmp-se07-drive-candidates-20260826]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install identification tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          git clone --depth 1 https://codeberg.org/raiguard/fmm.git fmm-src
          (cd fmm-src && go build -o ../fmm .)
          mkdir -p fake-factorio/data/base fake-factorio/mods candidates reports
          printf '%s\n' '{"name":"base","version":"2.0.72","title":"Base","author":"Wube","factorio_version":"2.0"}' > fake-factorio/data/base/info.json

      - name: Download Google Drive and OneDrive candidates
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, json, requests, re, urllib.parse, traceback, base64, html
          out=pathlib.Path('candidates'); out.mkdir(exist_ok=True)
          reports=pathlib.Path('reports'); reports.mkdir(exist_ok=True)
          result=[]
          drives={
            'migration_earendel_392':'1nScbABVE1hugI9Oj5Li6XRotivrJuBsp',
            'miniloader_modlist_save':'1gFuWk1QHVe4Jha4DD8eS57bzniwbyrn-',
            'miniloader_se06146_save':'1Tin_CrL075mHPVhDVdZtFErzZb86Hxbo',
            'factorissimo_migration_245':'1BFktsFpRaH8N5IHgbbquS9YHyNXClQxr',
            'factorissimo_issue250_comment':'1QdbvZ0kMRC3rd6IEHToag3MeR8p0v0Cc',
          }
          for name,fid in drives.items():
            target=out/(name+'.bin'); rec={'name':name,'kind':'gdrive','id':fid}
            try:
              p=subprocess.run(['gdown',fid,'-O',str(target)],capture_output=True,text=True,timeout=1500)
              rec.update(returncode=p.returncode,stdout=p.stdout[-8000:],stderr=p.stderr[-8000:])
              if target.exists(): rec['bytes']=target.stat().st_size
            except Exception as exc:
              rec['error']=repr(exc); rec['traceback']=traceback.format_exc()
            result.append(rec)

          name='ltn_se_only_longrunning_35'
          share='https://1drv.ms/u/c/2727bd721db2bdba/Efym695sJfpDv-5JVHyLeWcB0TTNre4JkTT-vKOaCbNhVA?e=C8oS1n'
          target=out/(name+'.bin'); rec={'name':name,'kind':'onedrive','url':share,'attempts':[]}
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept':'*/*'})
          encoded=base64.urlsafe_b64encode(share.encode()).decode().rstrip('=')
          endpoints=[
            'https://api.onedrive.com/v1.0/shares/u!'+encoded+'/root/content',
            'https://api.onedrive.com/v1.0/shares/u!'+encoded+'/driveItem/content',
            'https://graph.microsoft.com/v1.0/shares/u!'+encoded+'/driveItem/content',
            share+'&download=1',
          ]
          try:
            for endpoint in endpoints:
              try:
                r=s.get(endpoint,timeout=180,allow_redirects=True,stream=True)
                attempt={'endpoint':endpoint,'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('Content-Type'),'content_length':r.headers.get('Content-Length'),'content_disposition':r.headers.get('Content-Disposition')}
                rec['attempts'].append(attempt)
                ctype=(r.headers.get('Content-Type') or '').lower(); disp=(r.headers.get('Content-Disposition') or '').lower()
                if r.ok and ('zip' in ctype or 'octet-stream' in ctype or 'attachment' in disp):
                  with target.open('wb') as f:
                    for chunk in r.iter_content(1024*1024):
                      if chunk: f.write(chunk)
                  rec['bytes']=target.stat().st_size; rec['successful_endpoint']=endpoint; break
                if r.ok and 'text/html' in ctype:
                  text=r.text
                  (out/(name+'_'+str(len(rec['attempts']))+'.html')).write_text(text,errors='replace')
                  pats=[r'"downloadUrl"\s*:\s*"([^"]+)"',r'"@content.downloadUrl"\s*:\s*"([^"]+)"',r'"downloadUrl":"([^"]+)"']
                  dl=None
                  for pat in pats:
                    m=re.search(pat,text)
                    if m:
                      dl=html.unescape(m.group(1)).replace('\\u0026','&').replace('\\/','/')
                      try: dl=bytes(dl,'utf-8').decode('unicode_escape')
                      except Exception: pass
                      break
                  attempt['embedded_download_url']=dl
                  if dl:
                    rr=s.get(dl,timeout=180,allow_redirects=True,stream=True)
                    attempt['embedded_status']=rr.status_code; attempt['embedded_final_url']=rr.url; attempt['embedded_type']=rr.headers.get('Content-Type'); attempt['embedded_length']=rr.headers.get('Content-Length')
                    if rr.ok:
                      with target.open('wb') as f:
                        for chunk in rr.iter_content(1024*1024):
                          if chunk:f.write(chunk)
                      rec['bytes']=target.stat().st_size; rec['successful_endpoint']=dl; break
              except Exception as exc:
                rec['attempts'].append({'endpoint':endpoint,'error':repr(exc)})
          except Exception as exc:
            rec['error']=repr(exc); rec['traceback']=traceback.format_exc()
          result.append(rec)
          reports.joinpath('downloads.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY

      - name: Validate Factorio save structure and identify exact mods
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, json, zipfile, hashlib, shutil, os, traceback
          root=pathlib.Path('candidates'); rep=pathlib.Path('reports'); rows=[]
          for p in sorted(root.glob('*.bin')):
            row={'candidate':p.stem,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
            try:
              row['file_type']=subprocess.run(['file','-b',str(p)],capture_output=True,text=True).stdout.strip()
              if zipfile.is_zipfile(p):
                zpath=root/(p.stem+'.zip'); shutil.copy2(p,zpath)
                with zipfile.ZipFile(zpath) as z:
                  names=z.namelist(); row['zip_entries']=len(names); row['root_names']=sorted(set(x.split('/')[0] for x in names))[:50]
                  row['has_level_init']=any(n.endswith('/level-init.dat') for n in names); row['has_level_dat']=any('/level.dat' in n or n.endswith('/level.dat') for n in names); row['has_script_dat']=any(n.endswith('/script.dat') for n in names)
                  row['largest_entries']=sorted([{'name':i.filename,'size':i.file_size} for i in z.infolist()],key=lambda x:-x['size'])[:12]
                env=os.environ.copy(); env['FACTORIO_PATH']=str(pathlib.Path('fake-factorio').resolve()); env['FACTORIO_MODS_PATH']=str(pathlib.Path('fake-factorio/mods').resolve())
                proc=subprocess.run(['./fmm','list',str(zpath)],capture_output=True,text=True,env=env,timeout=240)
                row['fmm_returncode']=proc.returncode; row['fmm_stdout']=proc.stdout; row['fmm_stderr']=proc.stderr
                rep.joinpath(p.stem+'.mods.txt').write_text(proc.stdout+'\nSTDERR:\n'+proc.stderr)
              else:
                row['prefix_hex']=p.read_bytes()[:64].hex()
            except Exception as exc:
              row['error']=repr(exc); row['traceback']=traceback.format_exc()
            rows.append(row)
          rep.joinpath('identities.json').write_text(json.dumps(rows,indent=2)); print(json.dumps(rows,indent=2))
          PY

      - name: Upload candidate identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se07-public-drive-candidate-identities-v2
          path: reports/
          if-no-files-found: warn
          retention-days: 7
