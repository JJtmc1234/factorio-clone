name: Temporary SE candidate header inspection

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  RESULT_BRANCH: tmp-se-candidate-header-result-20260824

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work published
          mkdir -p work published/previews published/listings
          python3 -m pip install --quiet --upgrade gdown
          cat > work/inspect.py <<'PY'
          import hashlib, json, pathlib, struct, subprocess, zipfile
          P=pathlib.Path
          candidates=[
            ('1Tin_CrL075mHPVhDVdZtFErzZb86Hxbo','miniloader_migration_06146','SE 0.6.146 migration save'),
            ('1nScbABVE1hugI9Oj5Li6XRotivrJuBsp','migration_workaround_0754','migrated to SE 0.7.54'),
            ('1vjkxLhfwbmAmB_EA3MEdLSJ5PfK1JYzT','factorissimo_k2se','K2SE Factorissimo save'),
          ]
          class R:
            def __init__(self,d):self.d=d;self.o=0
            def u8(self):v=self.d[self.o];self.o+=1;return v
            def u16(self):v=struct.unpack_from('<H',self.d,self.o)[0];self.o+=2;return v
            def u32(self):v=struct.unpack_from('<I',self.d,self.o)[0];self.o+=4;return v
            def ver(self):return self.u16(),self.u16(),self.u16(),self.u16()
            def opt(self,b,fv):
              if fv>(0,14,14,0):
                x=self.u8()
                if x!=255:return x
              return self.u16() if b==16 else self.u32()
            def text(self,fv):
              n=self.opt(32,fv);v=self.d[self.o:self.o+n];self.o+=n;return v.decode('utf-8','replace')
            def v48(self,fv):return self.opt(16,fv),self.opt(16,fv),self.opt(16,fv)
          def header(d):
            r=R(d);fv=r.ver();r.u8();x={'factorio_version':'.'.join(map(str,fv[:3])),'factorio_version_full':'.'.join(map(str,fv)),'save_name':r.text(fv),'campaign':r.text(fv),'base_mod':r.text(fv)}
            x['difficulty']=r.u8();x['finished']=bool(r.u8());x['player_won']=bool(r.u8());x['next_level']=r.text(fv);x['can_continue']=bool(r.u8());x['finished_but_continuing']=bool(r.u8());x['saving_replay']=bool(r.u8());x['allow_non_admin_debug']=bool(r.u8());x['loaded_from']='.'.join(map(str,r.v48(fv)));x['loaded_from_build']=r.u32() if fv[0]>=2 else r.u16();x['allowed_commands']=bool(r.u8())
            if fv[0]>=2:r.o+=4
            mods={}
            for _ in range(r.opt(32,fv)):
              name=r.text(fv);ver='.'.join(map(str,r.v48(fv)));r.u32();mods[name]=ver
            x['mods']=mods;return x
          results=[]
          for fileid,name,note in candidates:
            path=P('work')/(name+'.zip');rec={'id':fileid,'name':name,'note':note}
            try:
              p=subprocess.run(['gdown','--no-cookies','-O',str(path),fileid],text=True,capture_output=True,timeout=1200)
              rec['download_stderr']=p.stderr[-2000:]
              if p.returncode:raise RuntimeError('gdown exit '+str(p.returncode))
              rec['bytes']=path.stat().st_size
              h=hashlib.sha256()
              with path.open('rb') as f:
                for chunk in iter(lambda:f.read(1048576),b''):h.update(chunk)
              rec['sha256']=h.hexdigest()
              with zipfile.ZipFile(path) as z:
                names=z.namelist();P('published/listings',name+'.txt').write_text('\n'.join(names))
                init=next((n for n in names if n.endswith('/level-init.dat') or n=='level-init.dat'),None)
                level=next((n for n in names if n.endswith('/level.dat') or n=='level.dat' or n.endswith('/level.dat0') or n=='level.dat0'),None)
                if not init or not level:raise RuntimeError('not Factorio save')
                hd=header(z.read(init));rec['header']=hd;rec['se_version']=hd['mods'].get('space-exploration');rec['k2_version']=hd['mods'].get('Krastorio2');rec['mod_count']=len(hd['mods'])
                script=next((n for n in names if n.endswith('/script.dat') or n=='script.dat'),None)
                if script:
                  b=z.read(script);rec['markers']={k:b.count(v) for k,v in {'rocket_science':b'se-rocket-science-pack','launch_pad':b'se-rocket-launch-pad','cargo_section':b'se-cargo-rocket-section','nauvis_orbit':b'Nauvis Orbit','space_lab':b'se-space-science-lab','space_scaffold':b'se-space-platform-scaffold'}.items()}
                preview=next((n for n in names if n.endswith('/preview.jpg') or n=='preview.jpg'),None)
                if preview:(P('published/previews')/(name+'.jpg')).write_bytes(z.read(preview))
            except Exception as e:rec['error']=repr(e)
            results.append(rec)
          P('published/results.json').write_text(json.dumps(results,indent=2))
          P('published/summary.txt').write_text('\n\n'.join(f"{r['name']}: {r.get('bytes')} bytes, Factorio {r.get('header',{}).get('factorio_version')}, SE {r.get('se_version')}, K2 {r.get('k2_version')}, mods {r.get('mod_count')}, error {r.get('error')}\nmarkers {r.get('markers')}" for r in results))
          print(P('published/summary.txt').read_text())
          PY
          python3 work/inspect.py | tee published/console.txt
      - name: Publish results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$RESULT_BRANCH"
          rm -rf tmp-se-candidate-header
          mkdir tmp-se-candidate-header
          cp -a published/. tmp-se-candidate-header/
          git add -f tmp-se-candidate-header
          git commit -m 'Parse accessible SE candidate headers'
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
