name: Temporary current SE server detail scan

on:
  push:
    branches: [tmp-se-parser-fetch-20260825]

permissions:
  contents: write

env:
  RESULT_BRANCH: tmp-se-current-server-result-20260825

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Query browser and Factorio detail APIs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf published work
          mkdir -p published work
          python3 - <<'PY'
          import json, pathlib, time, urllib.parse, urllib.request

          out = pathlib.Path('published')
          browser = 'https://browser.lambs.cafe/api/servers'
          detail_base = 'https://multiplayer.factorio.com/get-game-details/'

          def get_json(url, retries=5):
              last = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'JJ-SE-save-research/1.0'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.load(r)
                  except Exception as e:
                      last = e
                      time.sleep(1 + attempt)
              raise last

          searches = ['纯粹的se', 'space exploration', 'k2se', 'crossworld', 'amogus', 'connavar']
          records = {}
          raw_searches = {}
          for term in searches:
              url = browser + '?' + urllib.parse.urlencode({'search': term, 'limit': 1000})
              data = get_json(url)
              raw_searches[term] = data
              for s in data.get('servers', []):
                  records[int(s['game_id'])] = s

          # The exact-name candidate is the priority; these broad name/description searches
          # catch other plausible current SE worlds without probing unrelated servers.
          details = []
          errors = []
          for game_id, cached in sorted(records.items()):
              try:
                  d = get_json(detail_base + str(game_id))
                  mods = d.get('mods') or []
                  names = {str(m.get('name','')).lower(): str(m.get('version','')) for m in mods}
                  se_ver = names.get('space-exploration')
                  if se_ver or any(k in cached.get('name','').lower() for k in ('纯粹的se','k2se','space exploration','crossworld','amogus','connavar')):
                      d['_cached'] = cached
                      d['_space_exploration_version'] = se_ver
                      d['_krastorio2_version'] = names.get('krastorio2')
                      d['_hours'] = int(d.get('game_time_elapsed', 0)) / 216000
                      details.append(d)
              except Exception as e:
                  errors.append({'game_id': game_id, 'name': cached.get('name'), 'error': repr(e)})
              time.sleep(0.08)

          out.joinpath('searches.json').write_text(json.dumps(raw_searches, ensure_ascii=False, indent=2))
          out.joinpath('details.json').write_text(json.dumps(details, ensure_ascii=False, indent=2))
          out.joinpath('errors.json').write_text(json.dumps(errors, ensure_ascii=False, indent=2))

          lines = []
          for d in sorted(details, key=lambda x: (x.get('_space_exploration_version') is None, x.get('_hours',0))):
              lines += [
                  f"NAME: {d.get('name')}",
                  f"GAME_ID: {d.get('game_id')}",
                  f"PUBLIC_NO_PASSWORD: {not bool(d.get('has_password'))}",
                  f"ADDRESS: {d.get('host_address')}",
                  f"GAME_VERSION: {(d.get('application_version') or {}).get('game_version')}",
                  f"HOURS: {d.get('_hours'):.2f}",
                  f"SE: {d.get('_space_exploration_version')}",
                  f"K2: {d.get('_krastorio2_version')}",
                  f"MOD_COUNT: {len(d.get('mods') or [])}",
                  f"PLAYERS: {d.get('players')}",
                  f"DESCRIPTION: {d.get('description')}",
                  'MODS: ' + ', '.join(f"{m.get('name')}={m.get('version')}" for m in d.get('mods') or []),
                  '',
              ]
          out.joinpath('SUMMARY.txt').write_text('\n'.join(lines))
          print('\n'.join(lines))
          PY

      - name: Publish results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$RESULT_BRANCH"
          rm -rf tmp-se-current-server-scan
          mkdir tmp-se-current-server-scan
          cp -a published/. tmp-se-current-server-scan/
          git add -f tmp-se-current-server-scan
          git commit -m 'Scan current Space Exploration server details'
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
