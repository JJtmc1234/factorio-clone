name: Scan Factorio game IDs for SE servers

on:
  push:
    branches: [tmp-se-parser-fetch-20260825]

permissions:
  contents: write

env:
  RESULT_BRANCH: tmp-se-game-id-range-result-20260825

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Scan compact current game-id range
        shell: bash
        run: |
          set -euo pipefail
          rm -rf published
          mkdir published
          python3 -m pip install --quiet aiohttp
          python3 - <<'PY'
          import asyncio, aiohttp, json, pathlib, time

          START, END = 1261400, 1263900
          CONCURRENCY = 16
          BASE = 'https://multiplayer.factorio.com/get-game-details/'
          targets = [
              '纯粹的se',
              'crossworld gaming space exploration',
              'connavar game 1',
              'amogus inc.',
              'the smelly factory - season 15 - k2se',
          ]
          sem = asyncio.Semaphore(CONCURRENCY)
          valid = []
          se_servers = []
          target_matches = []
          status_counts = {}
          errors = []

          async def one(session, gid):
              async with sem:
                  try:
                      async with session.get(BASE + str(gid), timeout=aiohttp.ClientTimeout(total=12)) as r:
                          status_counts[str(r.status)] = status_counts.get(str(r.status), 0) + 1
                          if r.status != 200:
                              return
                          raw = await r.read()
                          try:
                              d = json.loads(raw)
                          except Exception:
                              return
                          if not isinstance(d, dict) or not d.get('name'):
                              return
                          d['_queried_game_id'] = gid
                          valid.append(d)
                          name = str(d.get('name','')).lower()
                          desc = str(d.get('description','')).lower()
                          mods = d.get('mods') or []
                          md = {str(m.get('name','')).lower():str(m.get('version','')) for m in mods if isinstance(m,dict)}
                          se = md.get('space-exploration')
                          if se and se.startswith('0.7'):
                              rec = {
                                  'game_id': d.get('game_id') or gid,
                                  'name': d.get('name'),
                                  'description': d.get('description'),
                                  'host_address': d.get('host_address'),
                                  'has_password': d.get('has_password'),
                                  'players': d.get('players'),
                                  'max_players': d.get('max_players'),
                                  'game_time_elapsed': d.get('game_time_elapsed'),
                                  'application_version': d.get('application_version'),
                                  'space_exploration': se,
                                  'krastorio2': md.get('krastorio2'),
                                  'mod_count': len(mods),
                                  'mods': mods,
                              }
                              se_servers.append(rec)
                          if any(t in name or t in desc for t in targets):
                              target_matches.append(d)
                  except Exception as e:
                      if len(errors) < 200:
                          errors.append({'game_id':gid,'error':repr(e)})

          async def main():
              connector = aiohttp.TCPConnector(limit=CONCURRENCY, ttl_dns_cache=300)
              headers={'User-Agent':'JJ-SE-save-research/1.0','Accept':'application/json,*/*'}
              async with aiohttp.ClientSession(connector=connector, headers=headers) as session:
                  for base in range(START, END + 1, 200):
                      await asyncio.gather(*(one(session,g) for g in range(base, min(base+200, END+1))))
                      await asyncio.sleep(0.25)

          started=time.time()
          asyncio.run(main())
          elapsed=time.time()-started
          out=pathlib.Path('published')
          out.joinpath('se-servers.json').write_text(json.dumps(sorted(se_servers,key=lambda x:int(x['game_id'])),ensure_ascii=False,indent=2))
          out.joinpath('target-matches.json').write_text(json.dumps(target_matches,ensure_ascii=False,indent=2))
          out.joinpath('errors.json').write_text(json.dumps(errors,ensure_ascii=False,indent=2))
          summary=[
              f'RANGE: {START}-{END}',
              f'ELAPSED_SECONDS: {elapsed:.1f}',
              f'STATUS_COUNTS: {status_counts}',
              f'VALID_CURRENT_GAMES: {len(valid)}',
              f'SE_0_7_SERVERS: {len(se_servers)}',
              f'TARGET_MATCHES: {len(target_matches)}',
              '',
          ]
          for s in sorted(se_servers,key=lambda x:int(x['game_id'])):
              summary.append(
                  f"SE: id={s['game_id']} name={s['name']} host={s['host_address']} password={s['has_password']} elapsed={s['game_time_elapsed']} SE={s['space_exploration']} K2={s['krastorio2']} mods={s['mod_count']} players={s['players']} desc={s['description']}"
              )
          summary.append('')
          for d in target_matches:
              summary.append(f"TARGET: id={d.get('game_id') or d.get('_queried_game_id')} name={d.get('name')} host={d.get('host_address')} password={d.get('has_password')}")
          out.joinpath('SUMMARY.txt').write_text('\n'.join(summary))
          print('\n'.join(summary))
          PY

      - name: Publish results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$RESULT_BRANCH"
          rm -rf tmp-se-game-id-range
          mkdir tmp-se-game-id-range
          cp -a published/. tmp-se-game-id-range/
          git add -f tmp-se-game-id-range
          git commit --allow-empty -m 'Scan current Factorio game IDs for SE 0.7 servers'
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
