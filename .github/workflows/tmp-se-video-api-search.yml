name: Temporary SE public video API search

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  RESULT_BRANCH: "tmp-se-video-api-result-20260824"

jobs:
  search:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Search public video metadata APIs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work published
          mkdir -p work published
          cat > work/search.py <<'PY'
          import json, re, time, urllib.parse, urllib.request, urllib.error, pathlib, ssl

          ssl._create_default_https_context = ssl._create_unverified_context
          ua = {'User-Agent': 'Mozilla/5.0 SE-save-search/1.0'}
          def get_json(url, timeout=25, data=None, headers=None):
              h = dict(ua)
              if headers: h.update(headers)
              req = urllib.request.Request(url, data=data, headers=h)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.load(r)

          url_re = re.compile(r'https?://[^\s<>\]\[()\"\']+')
          host_re = re.compile(r'(?:drive\.google\.com|docs\.google\.com|dropbox\.com|1drv\.ms|onedrive\.live\.com|mega\.nz|mediafire\.com|github\.com|gitlab\.com|patreon\.com|ko-fi\.com|refactorio\.de|\.zip(?:[?&#]|$))', re.I)
          queries = [
              'Factorio Space Exploration 0.7 first cargo rocket',
              'Factorio Space Exploration 0.7 rocket science',
              'Factorio SE 0.7 cargo rocket',
              'Factorio Space Exploration 0.7 save game',
              'Factorio Space Exploration 0.7 playthrough',
          ]
          exact_ids = {'dDyBD4oE5Qg'}
          errors=[]; instances=[]; videos={}; inspected=[]; links=[]

          # Discover Invidious instances with API enabled.
          try:
              raw = get_json('https://api.invidious.io/instances.json', timeout=30)
              for host, meta in raw:
                  details = meta.get('details') or {}
                  if meta.get('type') == 'https' and details.get('api') and details.get('monitor', {}).get('dailyRatios'):
                      instances.append('https://' + host)
                  elif meta.get('type') == 'https' and details.get('api'):
                      instances.append('https://' + host)
          except Exception as exc:
              errors.append({'stage':'instances','error':repr(exc)})

          # Add known public instances, availability varies by the minute because naturally it does.
          instances += [
              'https://inv.nadeko.net','https://yewtu.be','https://invidious.nerdvpn.de',
              'https://inv.us.projectsegfau.lt','https://invidious.private.coffee',
              'https://invidious.privacyredirect.com','https://iv.ggtyler.dev'
          ]
          seen=set(); instances=[x for x in instances if not (x in seen or seen.add(x))]

          working=[]
          for base in instances[:50]:
              try:
                  data = get_json(base + '/api/v1/stats', timeout=12)
                  if isinstance(data, dict): working.append(base)
              except Exception as exc:
                  errors.append({'stage':'probe','base':base,'error':repr(exc)})
              if len(working) >= 8: break

          for q in queries:
              for base in working:
                  try:
                      data = get_json(base + '/api/v1/search?' + urllib.parse.urlencode({'q':q,'type':'video','sort_by':'relevance'}), timeout=20)
                      for item in data[:30]:
                          vid=item.get('videoId')
                          if vid:
                              videos.setdefault(vid, {'videoId':vid,'title':item.get('title'),'author':item.get('author'),'queries':[]})['queries'].append(q)
                      break
                  except Exception as exc:
                      errors.append({'stage':'search','base':base,'query':q,'error':repr(exc)})
          for vid in exact_ids: videos.setdefault(vid, {'videoId':vid,'title':'','author':'','queries':['exact lead']})

          target_words=('rocket','space','orbit','science','cargo','launch','automation','automating','nauvis')
          ordered=sorted(videos.values(), key=lambda x:(0 if any(w in (x.get('title') or '').lower() for w in target_words) else 1,(x.get('title') or '').lower()))[:180]

          # YouTube Innertube fallback. The WEB client often returns shortDescription without login.
          def youtube_innertube(vid):
              body=json.dumps({'context':{'client':{'clientName':'WEB','clientVersion':'2.20260820.00.00','hl':'en'}},'videoId':vid}).encode()
              return get_json('https://www.youtube.com/youtubei/v1/player?prettyPrint=false', timeout=25, data=body, headers={'Content-Type':'application/json','Origin':'https://www.youtube.com'})

          for idx,item in enumerate(ordered):
              vid=item['videoId']; meta=None; source=None
              for base in working:
                  try:
                      meta=get_json(base + '/api/v1/videos/' + vid, timeout=20); source=base; break
                  except Exception as exc:
                      errors.append({'stage':'video','base':base,'id':vid,'error':repr(exc)})
              if meta is None:
                  try:
                      raw=youtube_innertube(vid)
                      vd=raw.get('videoDetails') or {}
                      if vd:
                          meta={'videoId':vid,'title':vd.get('title'),'author':vd.get('author'),'description':vd.get('shortDescription'),'lengthSeconds':vd.get('lengthSeconds')}
                          source='youtube-innertube'
                  except Exception as exc:
                      errors.append({'stage':'innertube','id':vid,'error':repr(exc)})
              rec=dict(item); rec['source']=source
              if meta:
                  desc=meta.get('description') or meta.get('shortDescription') or ''
                  rec.update({'title':meta.get('title') or rec.get('title'),'author':meta.get('author') or meta.get('authorId') or rec.get('author'),'description':desc,'published':meta.get('publishedText') or meta.get('published'),'lengthSeconds':meta.get('lengthSeconds')})
                  urls=[u.rstrip('.,;:!?') for u in url_re.findall(desc)]
                  rec['urls']=urls; rec['potential_save_links']=[u for u in urls if host_re.search(u)]
                  for u in rec['potential_save_links']:
                      links.append({'videoId':vid,'title':rec.get('title'),'author':rec.get('author'),'url':'https://www.youtube.com/watch?v='+vid,'link':u})
              inspected.append(rec)
              if idx%25==24: time.sleep(1)

          pathlib.Path('published/working-instances.json').write_text(json.dumps(working,indent=2))
          pathlib.Path('published/videos.json').write_text(json.dumps(inspected,indent=2))
          pathlib.Path('published/save-links.json').write_text(json.dumps(links,indent=2))
          pathlib.Path('published/save-links.txt').write_text('\n\n'.join(f"{x['title']} | {x['author']}\n{x['url']}\n{x['link']}" for x in links))
          pathlib.Path('published/exact-bold-viking.json').write_text(json.dumps([x for x in inspected if x['videoId']=='dDyBD4oE5Qg'],indent=2))
          pathlib.Path('published/errors.json').write_text(json.dumps(errors,indent=2))
          summary={'instances_discovered':len(instances),'instances_working':len(working),'videos_found':len(videos),'videos_inspected':len(inspected),'save_links':len(links)}
          pathlib.Path('published/summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
          python3 work/search.py | tee published/console.txt

      - name: Publish findings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$RESULT_BRANCH"
          rm -rf tmp-se-video-api-search
          mkdir -p tmp-se-video-api-search
          cp -a published/. tmp-se-video-api-search/
          git add -f tmp-se-video-api-search
          git commit -m 'Search public video APIs for SE save links'
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
