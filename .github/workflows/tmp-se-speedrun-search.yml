name: Temporary SE Speedrun.com save search

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  RESULT_BRANCH: "tmp-se-speedrun-result-20260824"

jobs:
  search:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Search Speedrun.com API and linked run evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work published
          mkdir -p work published/downloads

          cat > work/search.py <<'PY'
          from __future__ import annotations
          import json, pathlib, re, time, urllib.error, urllib.parse, urllib.request

          OUT = pathlib.Path('published')
          UA = {'User-Agent': 'JJ-SE-save-search/1.0 (public speedrun data research)'}
          errors = []

          def get_json(url: str, attempts: int = 6):
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers=UA)
                      with urllib.request.urlopen(req, timeout=60) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      if exc.code in (420, 429, 502, 503, 504) and attempt + 1 < attempts:
                          time.sleep(3 * (attempt + 1)); continue
                      raise
                  except Exception:
                      if attempt + 1 < attempts:
                          time.sleep(2 * (attempt + 1)); continue
                      raise

          API = 'https://www.speedrun.com/api/v1'
          game_queries = ['Factorio', 'Factorio Category Extensions', 'Space Exploration']
          games = {}
          for name in game_queries:
              url = API + '/games?' + urllib.parse.urlencode({'name': name, 'max': 200})
              try:
                  for game in get_json(url).get('data', []):
                      international = (game.get('names') or {}).get('international', '')
                      if 'factorio' in international.lower() or international.lower() == 'space exploration':
                          games[game['id']] = game
              except Exception as exc:
                  errors.append({'stage': 'game-search', 'name': name, 'error': repr(exc)})

          # Pull derived/category-extension games from every Factorio match.
          for game in list(games.values()):
              try:
                  data = get_json(API + f"/games/{game['id']}/derived-games").get('data', [])
                  for derived in data:
                      games[derived['id']] = derived
              except Exception as exc:
                  errors.append({'stage': 'derived-games', 'game': game['id'], 'error': repr(exc)})

          categories = {}
          variables = {}
          matching_category_ids = set()
          matching_value_filters = []
          text_hits = []

          def contains_se(text: str) -> bool:
              low = (text or '').lower()
              return ('space exploration' in low or 'space-exploration' in low or
                      re.search(r'(^|[^a-z0-9])se\s*0?[67]([^a-z0-9]|$)', low) is not None)

          for game in games.values():
              gid = game['id']
              try:
                  cats = get_json(API + f'/games/{gid}/categories?max=200').get('data', [])
              except Exception as exc:
                  errors.append({'stage': 'categories', 'game': gid, 'error': repr(exc)})
                  continue
              for cat in cats:
                  cat['_game'] = gid
                  categories[cat['id']] = cat
                  combined = ' '.join([cat.get('name') or '', cat.get('rules') or '', cat.get('weblink') or ''])
                  if contains_se(combined):
                      matching_category_ids.add(cat['id'])
                      text_hits.append({'type': 'category', 'game': gid, 'category': cat})
              try:
                  vars_ = get_json(API + f'/games/{gid}/variables?max=200').get('data', [])
              except Exception as exc:
                  errors.append({'stage': 'variables', 'game': gid, 'error': repr(exc)})
                  vars_ = []
              for var in vars_:
                  var['_game'] = gid
                  variables[var['id']] = var
                  if contains_se((var.get('name') or '') + ' ' + (var.get('description') or '')):
                      text_hits.append({'type': 'variable', 'game': gid, 'variable': var})
                  values = ((var.get('values') or {}).get('values') or {})
                  for value_id, value in values.items():
                      label = value.get('label') or ''
                      rules = value.get('rules') or ''
                      if contains_se(label + ' ' + rules):
                          matching_value_filters.append({'game': gid, 'variable': var['id'], 'value': value_id, 'label': label, 'rules': rules, 'category': var.get('category')})
                          text_hits.append({'type': 'value', 'game': gid, 'variable_id': var['id'], 'value_id': value_id, 'label': label, 'rules': rules})
                          if var.get('category'):
                              matching_category_ids.add(var['category'])

          # Fetch every run for Factorio-family games. There are only a few thousand.
          all_runs = []
          for game in games.values():
              gid = game['id']
              offset = 0
              while True:
                  url = API + '/runs?' + urllib.parse.urlencode({'game': gid, 'max': 200, 'offset': offset, 'orderby': 'submitted', 'direction': 'desc'})
                  try:
                      page = get_json(url).get('data', [])
                  except Exception as exc:
                      errors.append({'stage': 'runs', 'game': gid, 'offset': offset, 'error': repr(exc)})
                      break
                  all_runs.extend(page)
                  if len(page) < 200: break
                  offset += len(page)
                  time.sleep(0.7)

          url_re = re.compile(r'https?://[^\s<>\]\[()\"\']+')
          file_re = re.compile(r'(?:\.zip(?:[?&#]|$)|\.7z(?:[?&#]|$)|\.rar(?:[?&#]|$)|\.sav(?:[?&#]|$)|drive\.google\.com|docs\.google\.com|dropbox\.com|1drv\.ms|onedrive\.live\.com|mega\.nz|mediafire\.com|github\.com/.*/(?:releases|raw|blob)|archive\.org)', re.I)
          evidence_words = re.compile(r'\b(save|savegame|save file|replay|factorio zip|map download)\b', re.I)

          candidates = []
          for run in all_runs:
              cat_id = run.get('category')
              values = run.get('values') or {}
              exact_se_value = any(values.get(f['variable']) == f['value'] for f in matching_value_filters)
              comment = run.get('comment') or ''
              videos = ((run.get('videos') or {}).get('links') or [])
              video_uris = [v.get('uri') for v in videos if v.get('uri')]
              urls = [u.rstrip('.,;:!?') for u in url_re.findall(comment)]
              linked_files = [u for u in urls if file_re.search(u)]
              likely_se = cat_id in matching_category_ids or exact_se_value or contains_se(comment)
              evidence = bool(linked_files or evidence_words.search(comment))
              if likely_se or evidence:
                  candidates.append({
                      'id': run.get('id'), 'weblink': run.get('weblink'), 'game': run.get('game'),
                      'category': cat_id, 'date': run.get('date'), 'submitted': run.get('submitted'),
                      'status': run.get('status'), 'times': run.get('times'), 'players': run.get('players'),
                      'values': values, 'comment': comment, 'video_uris': video_uris,
                      'urls': urls, 'linked_files': linked_files, 'likely_space_exploration': likely_se,
                      'matched_category': cat_id in matching_category_ids, 'matched_value': exact_se_value,
                  })

          # Try to fetch HTML run pages for likely SE runs because file links may be rendered outside API comments.
          for rec in candidates:
              if not rec['likely_space_exploration'] or not rec.get('weblink'): continue
              try:
                  req = urllib.request.Request(rec['weblink'], headers=UA)
                  with urllib.request.urlopen(req, timeout=40) as response:
                      html = response.read(4_000_000).decode('utf-8', 'replace')
                  html_urls = [u.replace('\\u0026', '&').replace('&amp;', '&').rstrip('.,;:!?') for u in url_re.findall(html)]
                  rec['html_file_links'] = [u for u in html_urls if file_re.search(u)]
              except Exception as exc:
                  rec['html_error'] = repr(exc)

          # Attempt actual downloads of public file-host links where a direct URL is already exposed.
          downloads = []
          dedup_links = []
          seen = set()
          for rec in candidates:
              if not rec['likely_space_exploration']: continue
              for u in rec.get('linked_files', []) + rec.get('html_file_links', []):
                  if u not in seen:
                      seen.add(u); dedup_links.append((rec, u))
          for index, (rec, u) in enumerate(dedup_links[:50]):
              direct = u
              if 'drive.google.com/file/d/' in u:
                  m = re.search(r'/file/d/([^/]+)', u)
                  if m: direct = 'https://drive.usercontent.google.com/download?id=' + m.group(1) + '&export=download&confirm=t'
              elif 'dropbox.com/' in u:
                  direct = re.sub(r'[?&]dl=0', '', u)
                  direct += ('&' if '?' in direct else '?') + 'dl=1'
              try:
                  req = urllib.request.Request(direct, headers=UA)
                  with urllib.request.urlopen(req, timeout=180) as response:
                      data = response.read(200_000_001)
                      ctype = response.headers.get('Content-Type')
                  if len(data) > 200_000_000: raise RuntimeError('file over 200 MB limit')
                  name = f"{index:02d}_{rec['id']}.bin"
                  pathlib.Path('published/downloads', name).write_bytes(data)
                  downloads.append({'run': rec['id'], 'source': u, 'direct': direct, 'bytes': len(data), 'content_type': ctype, 'file': 'downloads/' + name, 'magic': data[:32].hex()})
              except Exception as exc:
                  downloads.append({'run': rec['id'], 'source': u, 'direct': direct, 'error': repr(exc)})

          summary = {
              'games': len(games), 'categories': len(categories), 'variables': len(variables),
              'matching_categories': len(matching_category_ids), 'matching_values': len(matching_value_filters),
              'all_runs': len(all_runs), 'candidate_runs': len(candidates),
              'likely_se_runs': sum(1 for r in candidates if r['likely_space_exploration']),
              'public_file_links': len(dedup_links), 'downloads_attempted': len(downloads),
          }
          OUT.joinpath('games.json').write_text(json.dumps(list(games.values()), indent=2))
          OUT.joinpath('categories.json').write_text(json.dumps(list(categories.values()), indent=2))
          OUT.joinpath('variables.json').write_text(json.dumps(list(variables.values()), indent=2))
          OUT.joinpath('matching-text.json').write_text(json.dumps(text_hits, indent=2))
          OUT.joinpath('candidate-runs.json').write_text(json.dumps(candidates, indent=2))
          OUT.joinpath('downloads.json').write_text(json.dumps(downloads, indent=2))
          OUT.joinpath('errors.json').write_text(json.dumps(errors, indent=2))
          OUT.joinpath('summary.json').write_text(json.dumps(summary, indent=2))
          OUT.joinpath('summary.txt').write_text('\n'.join(f'{k}: {v}' for k,v in summary.items()))
          print(json.dumps(summary, indent=2))
          PY

          python3 work/search.py | tee published/console.txt

      - name: Publish findings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$RESULT_BRANCH"
          rm -rf tmp-se-speedrun-search
          mkdir -p tmp-se-speedrun-search
          cp -a published/. tmp-se-speedrun-search/
          git add -f tmp-se-speedrun-search
          git commit -m 'Search Speedrun.com for Space Exploration saves'
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
